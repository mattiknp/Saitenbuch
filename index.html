<meta charset="utf-8">
<title>Saitenbuch — Bespannungs-Archiv</title>

<style>
/* ─────────── Tokens ─────────── */
:root{
  --bg:#EDEFEA; --bg2:#E3E7DE; --panel:#F7F8F4; --panel2:#FBFCF9;
  --line:#D2D9CD; --line-strong:#B9C3B2;
  --ink:#131A1D; --muted:#5D6B71; --faint:#8A969B;
  --accent:#C8F04C; --accent-ink:#1A2400; --accent-text:#4F6B00;
  --good:#2E7D4F; --warn:#B4741A; --bad:#B23A3A;
  --poly:#2B7FA8; --multi:#B4691F; --gut:#8A6B2E; --syn:#6A55B8; --kev:#A63A3A;
  --r:12px; --r-lg:18px;
  --f-display:"Avenir Next Condensed","Helvetica Neue Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(19,26,29,.06),0 8px 24px -12px rgba(19,26,29,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1418; --bg2:#0A0E11; --panel:#171E24; --panel2:#1E272E;
    --line:#2A343C; --line-strong:#3A4750;
    --ink:#E7EDF2; --muted:#93A2AC; --faint:#6B7A85;
    --accent:#C8F04C; --accent-ink:#16210A; --accent-text:#C8F04C;
    --good:#5DCB8E; --warn:#E0A64B; --bad:#E76C6C;
    --poly:#7FD4FF; --multi:#FFAB6B; --gut:#E9D6AC; --syn:#B9A5FF; --kev:#FF8A8A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1418; --bg2:#0A0E11; --panel:#171E24; --panel2:#1E272E;
  --line:#2A343C; --line-strong:#3A4750;
  --ink:#E7EDF2; --muted:#93A2AC; --faint:#6B7A85;
  --accent:#C8F04C; --accent-ink:#16210A; --accent-text:#C8F04C;
  --good:#5DCB8E; --warn:#E0A64B; --bad:#E76C6C;
  --poly:#7FD4FF; --multi:#FFAB6B; --gut:#E9D6AC; --syn:#B9A5FF; --kev:#FF8A8A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#EDEFEA; --bg2:#E3E7DE; --panel:#F7F8F4; --panel2:#FBFCF9;
  --line:#D2D9CD; --line-strong:#B9C3B2;
  --ink:#131A1D; --muted:#5D6B71; --faint:#8A969B;
  --accent:#C8F04C; --accent-ink:#1A2400; --accent-text:#4F6B00;
  --good:#2E7D4F; --warn:#B4741A; --bad:#B23A3A;
  --poly:#2B7FA8; --multi:#B4691F; --gut:#8A6B2E; --syn:#6A55B8; --kev:#A63A3A;
  --shadow:0 1px 2px rgba(19,26,29,.06),0 8px 24px -12px rgba(19,26,29,.18);
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ─────────── Shell ─────────── */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;flex:none}
.wordmark{font-family:var(--f-display);font-size:21px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1}
.wordmark small{display:block;font-family:var(--f-body);font-size:9.5px;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint);margin-top:3px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;order:3;width:100%;
  border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.tabs::-webkit-scrollbar{display:none}
@media(min-width:900px){.tabs{order:0;width:auto;border-top:0;padding-top:0;margin-top:0}}
.tab{background:none;border:0;padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;
  font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-family:var(--f-display);transition:background .15s,color .15s}
.tab:hover{color:var(--ink);background:var(--panel)}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 90px}

/* ─────────── Buttons ─────────── */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--panel);
  color:var(--ink);padding:8px 14px;border-radius:99px;cursor:pointer;font-size:13.5px;font-weight:600;
  transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--panel2);border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn-primary:hover{background:var(--accent);filter:brightness(1.06);border-color:transparent}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel);color:var(--ink);border-color:transparent}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn-danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn-danger:hover{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--line-strong)}

/* ─────────── Blocks ─────────── */
.eyebrow{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--faint)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.section-head{display:flex;align-items:baseline;gap:14px;margin:34px 0 14px}
.section-head h2{font-size:15px;text-transform:uppercase;letter-spacing:.12em}
.section-head .rule{flex:1;height:1px;background:var(--line)}

/* KPI strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.kpi{background:var(--panel);padding:15px 17px}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.01em;
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.kpi .v .u{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k{margin-top:7px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.kpi .sub{margin-top:3px;font-size:12px;color:var(--muted)}

/* Filter bar */
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:20px 0 16px}
.search{flex:1;min-width:190px;position:relative}
.search input[type=text]{width:100%;padding:9px 14px 9px 34px;border-radius:99px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
select,input[type=text],input[type=number],input[type=date],input[type=tel],textarea{
  padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
select{padding-right:26px;cursor:pointer}
input:focus,select:focus,textarea:focus{border-color:var(--line-strong)}

/* ─────────── Ledger (Archiv) ─────────── */
.ledger{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--panel)}
.lrow{display:grid;grid-template-columns:74px 1fr auto;gap:14px;align-items:center;padding:12px 16px;
  border-bottom:1px solid var(--line);cursor:pointer;background:var(--panel);transition:background .12s}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--panel2)}
.kg{text-align:center;padding:7px 4px 5px;border-radius:10px;background:var(--bg2);border:1px solid var(--line)}
.kg b{display:block;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1}
.kg span{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.kg.two b{font-size:15px;line-height:1.3}
.kg.two b+b{color:var(--muted);border-top:1px solid var(--line);margin-top:3px;padding-top:3px}
.lmain{min-width:0}
.lmain .who{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.15;letter-spacing:.005em}
.lmain .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center}
.lright{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.ldate{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.month-sep{padding:9px 16px;background:var(--bg2);border-bottom:1px solid var(--line);
  font-family:var(--f-display);font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:flex;justify-content:space-between}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11px;
  font-weight:600;border:1px solid var(--line);background:var(--bg2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:99px;border:1px solid rgba(128,128,128,.45);flex:none}
.chip.t-poly{color:var(--poly);border-color:color-mix(in srgb,var(--poly) 34%,transparent);background:color-mix(in srgb,var(--poly) 11%,transparent)}
.chip.t-multi{color:var(--multi);border-color:color-mix(in srgb,var(--multi) 34%,transparent);background:color-mix(in srgb,var(--multi) 11%,transparent)}
.chip.t-gut{color:var(--gut);border-color:color-mix(in srgb,var(--gut) 34%,transparent);background:color-mix(in srgb,var(--gut) 11%,transparent)}
.chip.t-syn{color:var(--syn);border-color:color-mix(in srgb,var(--syn) 34%,transparent);background:color-mix(in srgb,var(--syn) 11%,transparent)}
.chip.t-kev{color:var(--kev);border-color:color-mix(in srgb,var(--kev) 34%,transparent);background:color-mix(in srgb,var(--kev) 11%,transparent)}
.chip.open{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.chip.me{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 15%,transparent)}
.chip.hybrid{letter-spacing:.08em;text-transform:uppercase;font-size:10px}

/* Cards */
.grid{display:grid;gap:14px}
.grid.c3{grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.grid.c2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;
  cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--line-strong);transform:translateY(-2px);box-shadow:var(--shadow)}
.card h3{font-size:19px;line-height:1.15}
.card .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card .foot{margin-top:13px;padding-top:11px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:flex-end;gap:10px}
.stat-inline{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted)}
.stat-inline b{color:var(--ink);font-weight:600}

/* String shelf */
.shelf-row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:13px 16px;
  border-bottom:1px solid var(--line);cursor:pointer}
.shelf-row:last-child{border-bottom:0}
.shelf-row:hover{background:var(--panel2)}
.swatch{width:34px;height:34px;border-radius:9px;border:1px solid var(--line-strong);flex:none;position:relative;overflow:hidden}
.swatch.split::after{content:"";position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.bar{height:5px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.low>i{background:var(--warn)}
.bar.crit>i{background:var(--bad)}

/* Empty state */
.empty{text-align:center;padding:56px 24px;border:1px dashed var(--line-strong);border-radius:var(--r-lg);background:var(--panel)}
.empty h3{font-size:23px;margin-bottom:7px}
.empty p{color:var(--muted);max-width:44ch;margin:0 auto 20px}

/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(6,10,12,.62);backdrop-filter:blur(3px);z-index:60;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);width:100%;max-width:640px;
  box-shadow:var(--shadow);margin:auto;animation:pop .18s ease-out}
.modal.wide{max-width:760px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.mhead{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:20px;margin-right:auto;text-transform:uppercase;letter-spacing:.06em}
.mbody{padding:18px 20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
.mfoot .spacer{margin-right:auto}
.field{margin-bottom:14px}
.field>label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:1fr 1fr 1fr}
@media(max-width:620px){.row.c2,.row.c3{grid-template-columns:1fr}}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--bg2);width:fit-content}
.seg button{border:0;background:none;padding:5px 15px;border-radius:99px;cursor:pointer;font-size:13px;
  font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hint{font-size:12px;color:var(--faint);margin-top:5px}
.checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.checkline input{width:auto;accent-color:var(--accent)}
.stringpick{display:grid;grid-template-columns:1fr 86px;gap:10px;align-items:end}
@media(max-width:620px){.stringpick{grid-template-columns:1fr}}
.tension{display:flex;align-items:flex-end;gap:10px}
.tension>div{display:flex;flex-direction:column;gap:6px;width:108px}
.tension input{width:100%;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;
  text-align:center;padding:9px 6px}
.tlabel{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.tslash{font-family:var(--f-mono);font-size:20px;color:var(--faint);padding-bottom:8px}
.tunit{font-size:13.5px;font-weight:600;color:var(--muted);padding-bottom:11px}

/* Farbauswahl */
.cname{float:none;margin-left:6px;color:var(--muted);letter-spacing:0;text-transform:none;font-weight:600}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:36px;height:36px;border-radius:10px;border:1px solid var(--line-strong);background:var(--c);
  cursor:pointer;padding:0;transition:transform .12s}
.sw:hover{transform:translateY(-2px)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent)}
.sw.custom{display:grid;place-items:center;overflow:hidden;position:relative;
  background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#1abc9c,#3498db,#9b59b6,#e74c3c)}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}

/* Detail */
.detail{display:grid;grid-template-columns:150px 1fr;gap:22px}
@media(max-width:620px){.detail{grid-template-columns:1fr;justify-items:center;text-align:center}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:13.5px;align-items:baseline}
.dl dt{color:var(--faint);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0}

/* Charts */
.monthchart{display:flex;align-items:flex-end;gap:5px;height:132px;padding-top:8px}
.mbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.mbar .fill{width:100%;max-width:76px;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:2px;
  transition:height .4s cubic-bezier(.2,.7,.3,1)}
.mbar .fill.zero{background:var(--line)}
.mbar .lb{font-size:9.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.mbar .ct{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rank{display:flex;flex-direction:column;gap:11px}
.rank .r{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.rank .r .track{grid-column:1/-1;height:6px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.rank .r .track>i{display:block;height:100%;background:var(--accent);border-radius:99px;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.4)}
.tag{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:11px 20px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:90;box-shadow:var(--shadow);
  animation:pop .2s ease-out}
.list-note{font-size:12.5px;color:var(--muted);margin-top:10px}
.scopebar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hdr-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dirty{width:7px;height:7px;border-radius:99px;background:var(--warn);display:inline-block;margin-left:6px}
.dirty[hidden]{display:none}   /* sonst gewinnt das display oben gegen das hidden-Attribut */
.pruef{display:flex;flex-direction:column;gap:10px}
.pz{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;font-size:13.5px;line-height:1.45}
.pzi{font-weight:700;text-align:center}
.pz.gut .pzi{color:var(--good)}
.pz.schlecht .pzi{color:var(--bad)}
.pz.neutral .pzi{color:var(--faint)}
.syncdot{width:8px;height:8px;border-radius:99px;background:var(--faint);display:inline-block;margin-right:7px;flex:none}

/* Hinweisleiste zur Datensicherung */
.banner{max-width:1180px;margin:16px auto -6px;padding:12px 16px;border-radius:var(--r);
  display:flex;align-items:center;gap:12px;font-size:13.5px;line-height:1.45;
  border:1px solid var(--line);background:var(--panel)}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 50%,transparent);
  background:color-mix(in srgb,var(--warn) 11%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);
  background:color-mix(in srgb,var(--bad) 11%,transparent)}
.banner b{font-weight:700}
.banner .grow{flex:1;min-width:0}
.banner .acts{display:flex;gap:7px;flex:none;flex-wrap:wrap}
@media(max-width:700px){
  .banner{margin:14px 14px -4px;flex-wrap:wrap;gap:10px}
  .banner .grow{flex:1 1 100%}          /* Text bekommt die volle Breite */
  .banner .acts{width:100%}
}
.hr{height:1px;background:var(--line);margin:22px 0}
.scroll-x{overflow-x:auto}
.tabs{min-width:0}
.filters .kgin{width:86px}

/* Schmale Schirme: Ledger-Zeile stapeln, Filter zweispaltig */
@media(max-width:560px){
  .topbar-in{padding:10px 14px;gap:10px}
  .hdr-actions{gap:5px}
  .hdr-actions .btn{padding:5px 9px}
  main{padding:20px 14px 80px}
  .lrow{grid-template-columns:62px 1fr;gap:12px;padding:11px 13px}

<script>
"use strict";
(function(){
/* ══════════ Helpers ══════════ */
const $ = s => document.querySelector(s);
const KEY = "saitenbuch.v1";
const BAK = "saitenbuch.v1.vorher";   // Stand vor dem letzten Schreiben
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Math.random().toString(36).slice(2)+Date.now());
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => new Date().toISOString().slice(0,10);
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONTHS_S = ["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"];
const fmtDate = iso => { const d=new Date(iso+"T12:00:00"); return isNaN(d)?iso:`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`; };
const fmtKg = n => (n==null||n==="")?"–":Number(n).toFixed(n%1?1:0).replace(".",",");
const gmm = g => Number(g).toFixed(2).replace(".",",");
const lbs = kg => (Number(kg)*2.20462).toFixed(1).replace(".",",");
const eur = n => (Number(n)||0).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const daysBetween = (a,b) => Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
const plural = (n,one,many) => n===1?one:many;

const TYPES = {
  poly:{label:"Polyester",cls:"t-poly"}, multi:{label:"Multifilament",cls:"t-multi"},
  gut:{label:"Naturdarm",cls:"t-gut"}, syn:{label:"Synthetik-Darm",cls:"t-syn"}, kev:{label:"Kevlar",cls:"t-kev"}
};
const REASONS = ["Saitenriss","Verschleiß / Spannungsverlust","Neuer Schläger","Testbespannung","Turniervorbereitung"];

/* ══════════ State ══════════ */
let S = null;

function seed(){
  const meId = uid(), bladeId = uid();
  // Eigener Bestand: beides auf Rolle
  const strings = [
    {id:uid(),brand:"Solinco",model:"Hyper-G",type:"poly",gauge:1.20,color:"#4FA64F",own:true,roll:200,rollOpened:todayISO(),note:""},
    {id:uid(),brand:"Kirschbaum",model:"Pro Line II",type:"poly",gauge:1.25,color:"#1E1E20",own:true,roll:200,rollOpened:todayISO(),note:""}
  ];
  return {
    v:3,
    settings:{ownerId:meId, defaultMeters:12, defaultMainM:6.5, defaultCrossM:5.5},
    players:[{id:meId,name:"Ich",phone:"",club:"",note:"Eigenes Profil – Name jederzeit änderbar.",createdAt:todayISO()}],
    rackets:[{id:bladeId,ownerId:meId,brand:"Wilson",model:"Blade v9 98",mains:16,crosses:19,head:98,weight:305,grip:"L3",note:"Eigener Schläger",retired:false}],
    strings, jobs:[]
  };
}
/* Frühere Grundausstattung – wird beim Update entfernt, sofern nirgends verwendet.
   Hyper-G steht bewusst nicht in der Liste: die bleibt und bekommt eine Rolle. */
const LEGACY_CATALOG = ["Luxilon|ALU Power","Babolat|RPM Blast","Head|Lynx Tour","Yonex|Poly Tour Pro",
  "Tecnifibre|Razor Code","Wilson|NXT","Tecnifibre|X-One Biphase","Head|Velocity MLT","Babolat|VS Touch",
  "Prince|Synthetic Gut Duraflex"];

function migrate(st){
  if((st.v||1) < 2){
    const used = id => st.jobs.some(j=>j.mainId===id||j.crossId===id);
    st.strings = st.strings.filter(s=> used(s.id) || !LEGACY_CATALOG.includes(s.brand+"|"+s.model));
    const hyper = st.strings.find(s=>s.brand==="Solinco"&&s.model==="Hyper-G");
    if(hyper && !hyper.roll){ hyper.roll=200; hyper.rollOpened=todayISO(); }
    if(!st.strings.some(s=>s.brand==="Kirschbaum"&&s.model==="Pro Line II"))
      st.strings.push({id:uid(),brand:"Kirschbaum",model:"Pro Line II",type:"poly",gauge:1.25,
        color:"#1E1E20",own:true,roll:200,rollOpened:todayISO(),note:""});
    st.v = 2;
  }
  if(st.v < 3){
    // Herkunft nachtragen: mit Rolle = eigener Bestand, ohne Rolle = mitgebracht
    st.strings.forEach(s=>{ if(s.own===undefined) s.own = !!s.roll; });
    st.v = 3;
  }
  return st;
}

/* ── Speicher ──────────────────────────────────────────────────────────
   Die Browser-Kopie ist bequem, aber nicht verlässlich: in Artefakten kann
   sie beim Neuladen oder bei einer neuen Version verschwinden. Deshalb gilt
   die Datei-Sicherung als das eigentliche Archiv, und der Browser nur als
   Zwischenspeicher. Kein Lesefehler darf jemals stillschweigend zu einem
   leeren Archiv führen. */
let storageOK = true;      // Schreiben möglich?
let loadProblem = null;    // Text, falls Gespeichertes nicht lesbar war
let bannerZu = false;      // Hinweisleiste in dieser Sitzung ausgeblendet

function ensureMeta(st){
  if(!st.meta) st.meta = {exportedAt:null, syncedAt:null, changes:0};
  if(typeof st.meta.changes!=="number") st.meta.changes = 0;
  if(st.meta.syncedAt===undefined) st.meta.syncedAt = null;
  return st;
}

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ storageOK = false; loadProblem = "Dieser Browser lässt keinen Speicher zu."; return ensureMeta(seed()); }

  if(raw == null) return ensureMeta(seed());          // wirklich zum ersten Mal

  try{
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.players) || !Array.isArray(p.jobs)) throw new Error("unerwarteter Aufbau");
    return ensureMeta(migrate(p));
  }catch(e){
    // Nicht überschreiben: das Rohgespeicherte beiseitelegen, damit nichts verloren geht
    try{ localStorage.setItem(KEY+".beschaedigt", raw); }catch(_){}
    loadProblem = "Der gespeicherte Stand war nicht lesbar ("+e.message+"). "+
      "Er wurde unter „saitenbuch.v1.beschaedigt“ beiseitegelegt, nichts wurde überschrieben.";
    return ensureMeta(seed());
  }
}

function persist(){
  try{
    const prev = localStorage.getItem(KEY);
    if(prev) localStorage.setItem(BAK, prev);         // rollender Vorgänger-Stand
    localStorage.setItem(KEY, JSON.stringify(S));
    storageOK = true;
  }catch(e){
    storageOK = false;
    toast("Browser-Speicher nicht verfügbar – bitte über „Sichern“ als Datei ablegen");
  }
}

function save(){
  ensureMeta(S);
  S.meta.changes++;
  persist();
  queueSync();               // bei eingeschaltetem GitHub-Abgleich automatisch hochladen
  // Ohne laufenden GitHub-Abgleich nach ein paar Änderungen an die Datei erinnern
  if(!ghAktiv() && (S.meta.changes===4 || S.meta.changes===12 || S.meta.changes%25===0))
    setTimeout(()=>toast("Denk an eine Sicherung: ⬇ Sichern in der Kopfzeile"), 900);
}

/* ══════════ Lookups ══════════ */
const player = id => S.players.find(p=>p.id===id);
const racket = id => S.rackets.find(r=>r.id===id);
const strg   = id => S.strings.find(s=>s.id===id);
const pName  = id => (player(id)||{}).name || "Unbekannt";
const rName  = id => { const r=racket(id); return r? `${r.brand} ${r.model}` : "Unbekannter Schläger"; };
const sName  = id => { const s=strg(id); return s? `${s.brand} ${s.model}` : "—"; };
const sFull  = id => { const s=strg(id); return s? `${s.brand} ${s.model} ${gmm(s.gauge)}` : "—"; };
const isMe   = id => id===S.settings.ownerId;
const jobsSorted = () => [...S.jobs].sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||"").localeCompare(a.createdAt||""));
const jobsOf = pid => jobsSorted().filter(j=>j.playerId===pid);
const jobsOfRacket = rid => jobsSorted().filter(j=>j.racketId===rid);
const jobsWithString = sid => jobsSorted().filter(j=>j.mainId===sid||j.crossId===sid);
const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : null;

/* Zwei Saiten = Hybrid. Zwei Härten = geteilte Bespannung (z. B. 24/23) –
   das gibt es auch mit nur einer Saite und wird überall getrennt ausgewiesen. */
const isHybrid = j => !!(j.crossId && j.crossId!==j.mainId);
const isSplit  = j => Number(j.tMain)!==Number(j.tCross);
const tensions = j => isSplit(j)? [+j.tMain,+j.tCross] : [+j.tMain];

function stringRemaining(s){
  if(!s.roll) return null;
  const used = S.jobs.filter(j=> !s.rollOpened || j.date >= s.rollOpened)
    .reduce((sum,j)=> sum + (j.mainId===s.id?(+j.mainM||0):0) + (j.crossId===s.id?(+j.crossM||0):0), 0);
  return Math.max(0, s.roll - used);
}

/* ══════════ Rendering bits ══════════ */
function typeChip(s){
  if(!s) return "";
  const t = TYPES[s.type]||{label:s.type,cls:""};
  return `<span class="chip ${t.cls}"><span class="dot" style="background:${esc(s.color||"#888")}"></span>${esc(t.label)}</span>`;
}
function kgCell(j){
  if(!isSplit(j)) return `<div class="kg"><b>${fmtKg(j.tMain)}</b><span>kg</span></div>`;
  // Geteilte Bespannung: längs oben, quer darunter – passt in jeder Breite
  return `<div class="kg two" title="längs ${fmtKg(j.tMain)} kg / quer ${fmtKg(j.tCross)} kg">
    <b>${fmtKg(j.tMain)}</b><b>${fmtKg(j.tCross)}</b><span>kg</span></div>`;
}

/* Saitenbett-Grafik: Längs- und Quersaiten in echter Saitenfarbe */
function stringBed(j, w){
  const r = racket(j.racketId);
  const mains = (r&&r.mains)||16, crosses = (r&&r.crosses)||19;
  const cm = (strg(j.mainId)||{}).color || "#999";
  const cc = j.crossId ? ((strg(j.crossId)||{}).color || "#999") : cm;
  const W=120,H=178,cx=60,cy=76,rx=48,ry=62, id="bed"+Math.random().toString(36).slice(2,8);
  let sv = `<svg viewBox="0 0 ${W} ${H}" width="${w}" style="max-width:100%;height:auto" role="img" aria-label="Saitenbett ${mains}×${crosses}">
    <defs><clipPath id="${id}"><ellipse cx="${cx}" cy="${cy}" rx="${rx-2}" ry="${ry-2}"/></clipPath></defs>
    <path d="M${cx-13} ${cy+ry-6} L${cx-4} ${H-42} L${cx-4} ${H-4} M${cx+13} ${cy+ry-6} L${cx+4} ${H-42} L${cx+4} ${H-4}"
      fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".85"/>
    <rect x="${cx-6.5}" y="${H-36}" width="13" height="34" rx="4" fill="currentColor" opacity=".9"/>
    <g clip-path="url(#${id})">`;
  for(let i=0;i<mains;i++){
    const x = cx - rx*0.80 + (2*rx*0.80)*(i/(mains-1));
    sv += `<line x1="${x.toFixed(2)}" y1="${cy-ry}" x2="${x.toFixed(2)}" y2="${cy+ry}" stroke="${cm}" stroke-width="1.5" opacity=".95"/>`;
  }
  for(let i=0;i<crosses;i++){
    const y = cy - ry*0.84 + (ry*1.62)*(i/(crosses-1));
    sv += `<line x1="${cx-rx}" y1="${y.toFixed(2)}" x2="${cx+rx}" y2="${y.toFixed(2)}" stroke="${cc}" stroke-width="1.5" opacity=".95"/>`;
  }
  sv += `</g><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="currentColor" stroke-width="4.5"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx-2.2}" ry="${ry-2.2}" fill="none" stroke="currentColor" stroke-width=".6" opacity=".35"/></svg>`;
  return sv;
}

/* ══════════ Views ══════════ */
const TABS = [
  {id:"archiv",  label:"Archiv"},
  {id:"spieler", label:"Spieler"},
  {id:"schlaeger",label:"Schläger"},
  {id:"saiten",  label:"Saitenregal"},
  {id:"statistik",label:"Statistik"}
];
let route = {tab:"archiv"};
let F = {q:"",player:"",string:"",period:"",kgMin:"",kgMax:"",sort:"date"};
let statScope = "alle";   // alle | ich | andere

function renderTabs(){
  $("#tabs").innerHTML = TABS.map(t=>
    `<button class="tab" data-tab="${t.id}" aria-current="${route.tab===t.id}">${t.label}</button>`).join("");
}

/* Hinweisleiste: macht den Speicherzustand sichtbar, statt ihn zu verschweigen */
function renderBanner(){
  const slot = $("#bannerSlot");
  const dot = $("#dirtyDot");
  const offen = S.meta && S.meta.changes>0;
  if(dot) dot.hidden = !offen;

  if(bannerZu){ slot.innerHTML=""; return; }
  let cls="", text="", acts=`<button class="btn btn-sm" id="bnExport">⬇ Sichern</button>
    <button class="btn btn-sm btn-ghost" id="bnZu">Verstanden</button>`;

  if(loadProblem){
    cls="bad";
    text=`<b>Gespeicherter Stand nicht lesbar.</b> ${esc(loadProblem)}`;
    acts=`<button class="btn btn-sm" id="bnImport">⬆ Sicherung laden</button>
      <button class="btn btn-sm btn-ghost" id="bnZu">Ausblenden</button>`;
  } else if(ghAktiv() && syncState==="err"){
    cls="bad";
    text = syncText.indexOf("gesperrt")>=0
      ? `<b>GitHub ist von hier nicht erreichbar.</b> Das veröffentlichte Artefakt darf keine fremden Server ansprechen. Öffne <span class="num">~/Claude/Artifacts/saitenbuch/index.html</span> direkt im Browser, dann läuft der Abgleich — bis dahin bitte über ⬇ Sichern arbeiten.`
      : `<b>GitHub-Abgleich fehlgeschlagen.</b> ${esc(syncText)}`;
    acts=`<button class="btn btn-sm" id="bnGh">GitHub prüfen</button>
      <button class="btn btn-sm" id="bnExport">⬇ Sichern</button>
      <button class="btn btn-sm btn-ghost" id="bnZu">Ausblenden</button>`;
  } else if(ghAktiv() && S.meta.syncedAt && S.meta.changes===0){
    slot.innerHTML=""; return;                      // alles auf GitHub, kein Hinweis nötig
  } else if(!storageOK && !ghAktiv()){
    cls="bad";
    text=`<b>Der Browser speichert hier nichts.</b> Alles, was du eingibst, ist nach dem Schließen weg — sichere es als Datei.`;
  } else if(!S.jobs.length){
    cls="";
    text=`<b>So bleibt nichts verloren:</b> Das Archiv liegt zunächst nur in diesem Browser und kann beim Neuladen verschwinden. Nach dem Eintragen mit <b>⬇ Sichern</b> als Datei ablegen, mit <b>⬆ Laden</b> wieder zurückholen.`;
  } else if(!S.meta.exportedAt){
    cls="warn";
    text=`<b>Noch nie gesichert.</b> ${S.jobs.length} ${plural(S.jobs.length,"Eintrag","Einträge")} liegen nur im Browser-Speicher. Ein Klick auf Sichern legt sie als Datei ab.`;
  } else if(S.meta.changes>=4){
    cls="warn";
    text=`<b>${S.meta.changes} ${plural(S.meta.changes,"Änderung","Änderungen")} seit der letzten Sicherung</b> vom ${fmtDate(S.meta.exportedAt.slice(0,10))}. Ein Klick auf Sichern bringt die Datei auf Stand.`;
  } else { slot.innerHTML=""; return; }

  slot.innerHTML = `<div class="banner ${cls}">
    <span class="grow">${text}</span><span class="acts">${acts}</span></div>`;
}

function render(){
  renderTabs();
  renderBanner();
  const v = $("#view");
  if(route.tab==="archiv") v.innerHTML = viewArchive();
  else if(route.tab==="spieler") v.innerHTML = viewPlayers();
  else if(route.tab==="schlaeger") v.innerHTML = viewRackets();
  else if(route.tab==="saiten") v.innerHTML = viewStrings();
  else v.innerHTML = viewStats();
  window.scrollTo({top:0,behavior:"instant"});
}

/* ---------- Archiv ---------- */
function filtered(){
  const q = F.q.trim().toLowerCase();
  let list = jobsSorted().filter(j=>{
    if(F.player && j.playerId!==F.player) return false;
    if(F.string && j.mainId!==F.string && j.crossId!==F.string) return false;
    if(F.period){
      if(F.period==="30"){ if(daysBetween(j.date,todayISO())>30) return false; }
      else if(F.period==="365"){ if(daysBetween(j.date,todayISO())>365) return false; }
      else if(!j.date.startsWith(F.period)) return false;
    }
    const ts = tensions(j), t = Math.min(...ts), t2 = Math.max(...ts);
    if(F.kgMin!=="" && t2 < +F.kgMin) return false;
    if(F.kgMax!=="" && t > +F.kgMax) return false;
    if(q){
      const hay = [pName(j.playerId), rName(j.racketId), sFull(j.mainId), j.crossId?sFull(j.crossId):"", j.note, j.reason,
        fmtKg(j.tMain)+"kg"].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(F.sort==="kg") list.sort((a,b)=> b.tMain-a.tMain);
  else if(F.sort==="player") list.sort((a,b)=> pName(a.playerId).localeCompare(pName(b.playerId)) || b.date.localeCompare(a.date));
  return list;
}

function viewArchive(){
  if(!S.jobs.length) return emptyState();
  const list = filtered();
  const years = [...new Set(S.jobs.map(j=>j.date.slice(0,4)))].sort().reverse();
  const usedStrings = [...new Set(S.jobs.flatMap(j=>[j.mainId,j.crossId]).filter(Boolean))];
  const kgs = list.flatMap(tensions).filter(n=>!isNaN(n));
  const open = list.filter(j=>!j.paid && +j.price>0).reduce((a,j)=>a+ +j.price,0);

  return `
  <section class="kpis">
    ${kpi(list.length, "", "Bespannungen", list.length===S.jobs.length? "gesamtes Archiv":"in dieser Auswahl")}
    ${kpi(avg(kgs)!=null? fmtKg(Math.round(avg(kgs)*10)/10):"–","kg","Ø Härte", kgs.length? `${fmtKg(Math.min(...kgs))}–${fmtKg(Math.max(...kgs))} kg Spanne`:"")}
    ${kpi(new Set(list.map(j=>j.playerId)).size,"","Spieler", `${new Set(list.map(j=>j.racketId)).size} ${plural(new Set(list.map(j=>j.racketId)).size,"Schläger","Schläger")}`)}
    ${kpi(list.filter(j=>daysBetween(j.date,todayISO())<=30).length,"","Letzte 30 Tage", open>0? `${eur(open)} offen`:"alles bezahlt")}
  </section>

  <div class="filters">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5" stroke-linecap="round"/></svg>
      <input type="text" id="fq" placeholder="Suchen: Name, Schläger, Saite, Notiz…" value="${esc(F.q)}">
    </div>
    <select id="fplayer"><option value="">Alle Spieler</option>
      ${S.players.map(p=>`<option value="${p.id}" ${F.player===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <select id="fstring"><option value="">Alle Saiten</option>
      ${usedStrings.map(id=>`<option value="${id}" ${F.string===id?"selected":""}>${esc(sName(id))}</option>`).join("")}</select>
    <select id="fperiod"><option value="">Ganzes Archiv</option>
      <option value="30" ${F.period==="30"?"selected":""}>Letzte 30 Tage</option>
      <option value="365" ${F.period==="365"?"selected":""}>Letzte 12 Monate</option>
      ${years.map(y=>`<option value="${y}" ${F.period===y?"selected":""}>${y}</option>`).join("")}</select>
    <select id="fsort"><option value="date" ${F.sort==="date"?"selected":""}>Neueste zuerst</option>
      <option value="kg" ${F.sort==="kg"?"selected":""}>Härte absteigend</option>
      <option value="player" ${F.sort==="player"?"selected":""}>Nach Spieler</option></select>
    <input type="number" id="fkgmin" class="kgin" placeholder="kg ab" step="0.5" min="10" max="40" value="${esc(F.kgMin)}">
    <input type="number" id="fkgmax" class="kgin" placeholder="kg bis" step="0.5" min="10" max="40" value="${esc(F.kgMax)}">
    ${Object.values(F).some(v=>v&&v!=="date")? `<button class="btn btn-sm btn-ghost" id="fclear">Filter zurücksetzen</button>`:""}
  </div>

  ${list.length? `<div class="ledger">${ledgerRows(list)}</div>
    <p class="list-note">${list.length} von ${S.jobs.length} ${plural(S.jobs.length,"Eintrag","Einträgen")} · Zeile anklicken für Details, Saitenbett und „nochmal so bespannen“.</p>`
   : `<div class="empty"><h3>Nichts gefunden</h3><p>Für diese Filter gibt es keinen Eintrag im Archiv.</p>
      <button class="btn" id="fclear">Filter zurücksetzen</button></div>`}
  `;
}

function ledgerRows(list, opts){
  opts = opts||{};
  let html = "", lastKey = "";
  list.forEach(j=>{
    const key = j.date.slice(0,7);
    if(!opts.noMonths && key!==lastKey && F.sort==="date"){
      lastKey = key;
      const inMonth = list.filter(x=>x.date.slice(0,7)===key);
      html += `<div class="month-sep"><span>${MONTHS[+key.slice(5,7)-1]} ${key.slice(0,4)}</span>
        <span class="num">${inMonth.length}×</span></div>`;
    }
    const hy = isHybrid(j);
    const sm = strg(j.mainId), sc = hy? strg(j.crossId) : null;
    const inPlayer = opts.context==="player";
    html += `<div class="lrow" data-job="${j.id}" role="button" tabindex="0">
      ${kgCell(j)}
      <div class="lmain">
        <div class="who">${esc(inPlayer? rName(j.racketId) : pName(j.playerId))}${!inPlayer&&isMe(j.playerId)?' <span class="chip me">eigen</span>':""}</div>
        <div class="meta">
          ${inPlayer? "" : `<span>${esc(rName(j.racketId))}</span><span style="color:var(--faint)">·</span>`}
          ${typeChip(sm)}
          ${hy? `<span class="chip hybrid">Hybrid</span>` : ""}
          <span>${esc(sName(j.mainId))}${hy? " / "+esc(sName(j.crossId)) : ""}</span>
          ${!j.paid && +j.price>0? `<span class="chip open">${eur(j.price)} offen</span>`:""}
        </div>
      </div>
      <div class="lright">
        <span class="ldate">${fmtDate(j.date)}</span>
        <span class="stat-inline">${isSplit(j)? lbs(j.tMain)+" / "+lbs(j.tCross)+" lbs" : lbs(j.tMain)+" lbs"}</span>
      </div>
    </div>`;
  });
  return html;
}

function kpi(v,u,k,sub){
  return `<div class="kpi"><div class="v">${v}${u?`<span class="u">${u}</span>`:""}</div>
    <div class="k">${k}</div>${sub?`<div class="sub">${sub}</div>`:""}</div>`;
}

function emptyState(){
  return `<div class="empty">
    <svg width="66" height="98" viewBox="0 0 120 178" style="color:var(--line-strong);margin-bottom:14px">
      <ellipse cx="60" cy="76" rx="48" ry="62" fill="none" stroke="currentColor" stroke-width="4.5"/>
      <path d="M47 132 L56 136 L56 174 M73 132 L64 136 L64 174" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"/>
    </svg>
    <h3>Noch kein Eintrag im Archiv</h3>
    <p>Trag deine erste Bespannung ein – Spieler, Schläger, Saite und Kilo. Danach findest du hier jede Bespannung wieder, mit Verlauf pro Schläger und Ø-Härte pro Spieler.</p>
    <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary" id="btnFirst">Erste Bespannung eintragen</button>
    </div>
    <p class="hint" style="margin-top:18px">Nur zum Anschauen: <button class="btn btn-sm btn-ghost" id="btnDemo">Beispieldaten laden</button></p>
  </div>`;

function playerDetail(p){
  const js = jobsOf(p.id), rs = S.rackets.filter(r=>r.ownerId===p.id);
  const kgs = js.flatMap(tensions);
  const counts = {};
  js.forEach(j=>{ [j.mainId,j.crossId].filter(Boolean).forEach(id=> counts[id]=(counts[id]||0)+1); });
  const fav = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
  const intervals = [];
  rs.forEach(r=>{ const rj=jobsOfRacket(r.id); for(let i=0;i<rj.length-1;i++) intervals.push(daysBetween(rj[i+1].date, rj[i].date)); });
  return `<div class="mbody">
    <div class="kpis" style="margin-bottom:18px">
      ${kpi(js.length,"","Bespannungen","")}
      ${kpi(kgs.length? fmtKg(Math.round(avg(kgs)*10)/10):"–","kg","Ø Härte", kgs.length? lbs(avg(kgs))+" lbs":"")}
      ${kpi(intervals.length? Math.round(avg(intervals)):"–", intervals.length?"Tage":"", "Ø Intervall", intervals.length? "zwischen zwei Bespannungen":"noch zu wenig Daten")}
      ${kpi(fav? counts[fav[0]]+"×":"–","","Lieblingssaite", fav? esc(sName(fav[0])):"")}
    </div>
    ${p.phone||p.club||p.note? `<dl class="dl" style="margin-bottom:18px">
      ${p.phone?`<dt>Kontakt</dt><dd>${esc(p.phone)}</dd>`:""}
      ${p.club?`<dt>Verein</dt><dd>${esc(p.club)}</dd>`:""}
      ${p.note?`<dt>Notiz</dt><dd>${esc(p.note)}</dd>`:""}</dl>`:""}
    <div class="section-head" style="margin-top:0"><h2>Schläger</h2><span class="rule"></span></div>
    ${rs.length? `<div class="grid c2">${rs.map(r=>racketCardInner(r)).join("")}</div>`
      : `<p style="color:var(--muted)">Noch kein Schläger hinterlegt.</p>`}
    <div class="section-head"><h2>Verlauf</h2><span class="rule"></span></div>
    ${js.length? `<div class="ledger">${ledgerRows(js,{noMonths:true,context:"player"})}</div>`
      : `<p style="color:var(--muted)">Noch keine Bespannung.</p>`}
  </div>`;
}

/* ---------- Schläger ---------- */
function racketCardInner(r){
  const js = jobsOfRacket(r.id), last = js[0];
  const days = last? daysBetween(last.date,todayISO()) : null;
  const flag = days==null? "" : days>120? "bad" : days>75? "warn" : "good";
  return `<div class="card" data-racket="${r.id}" role="button" tabindex="0">
    <h3>${esc(r.brand)} ${esc(r.model)}</h3>
    <div class="sub">${esc(pName(r.ownerId))} · <span class="num">${r.mains}×${r.crosses}</span>${r.head?` · ${r.head} in²`:""}${r.weight?` · ${r.weight} g`:""}</div>
    <div class="foot">
      <div>
        <div class="stat-inline"><b>${js.length}</b> ${plural(js.length,"Bespannung","Bespannungen")}</div>
        ${last? `<div class="stat-inline">zuletzt <b>${fmtKg(last.tMain)}${isSplit(last)? "/"+fmtKg(last.tCross):""}</b> kg</div>`:""}
      </div>
      <div style="text-align:right">
        ${last? `<div class="stat-inline" style="color:var(--${flag||"muted"})"><b>vor ${days} ${plural(days,"Tag","Tagen")}</b></div>
          <div class="stat-inline">${esc(sName(last.mainId))}</div>`
          : `<div class="stat-inline">noch nie bespannt</div>`}
      </div>
    </div>
  </div>`;
}
function viewRackets(){
  const rs = [...S.rackets].sort((a,b)=> (isMe(b.ownerId)?1:0)-(isMe(a.ownerId)?1:0) || jobsOfRacket(b.id).length-jobsOfRacket(a.id).length);
  return `<div class="section-head"><h2>Schläger</h2><span class="rule"></span>
    <button class="btn btn-sm" id="addRacket">＋ Schläger</button></div>
    ${rs.length? `<div class="grid c2">${rs.map(racketCardInner).join("")}</div>`:`<div class="empty"><h3>Kein Schläger</h3><p>Leg deinen ersten Schläger an.</p><button class="btn btn-primary" id="addRacket">Schläger anlegen</button></div>`}`;
}
function racketDetail(r){
  const js = jobsOfRacket(r.id);
  const kgs = js.flatMap(tensions);
  const iv = []; for(let i=0;i<js.length-1;i++) iv.push(daysBetween(js[i+1].date, js[i].date));
  const last = js[0];
  return `<div class="mbody">
    <div class="detail" style="margin-bottom:20px">
      <div style="color:var(--ink)">${last? stringBed(last,140) : `<div style="opacity:.4">${stringBed({racketId:r.id,mainId:null,crossId:null},140)}</div>`}</div>
      <dl class="dl" style="align-self:start">
        <dt>Besitzer</dt><dd>${esc(pName(r.ownerId))}</dd>
        <dt>Besaitungsbild</dt><dd class="num">${r.mains} × ${r.crosses}</dd>
        ${r.head?`<dt>Kopfgröße</dt><dd class="num">${r.head} in²</dd>`:""}
        ${r.weight?`<dt>Gewicht</dt><dd class="num">${r.weight} g</dd>`:""}
        ${r.grip?`<dt>Griff</dt><dd>${esc(r.grip)}</dd>`:""}
        ${last?`<dt>Letzte Härte</dt><dd class="num">${fmtKg(last.tMain)}${isSplit(last)?" / "+fmtKg(last.tCross):""} kg · ${lbs(last.tMain)}${isSplit(last)?" / "+lbs(last.tCross):""} lbs</dd>`:""}
        ${kgs.length?`<dt>Ø Härte</dt><dd class="num">${fmtKg(Math.round(avg(kgs)*10)/10)} kg</dd>`:""}
        ${iv.length?`<dt>Ø Intervall</dt><dd class="num">${Math.round(avg(iv))} Tage</dd>`:""}
        ${r.note?`<dt>Notiz</dt><dd>${esc(r.note)}</dd>`:""}
      </dl>
    </div>
    <div class="section-head" style="margin-top:0"><h2>Bespannungs-Historie</h2><span class="rule"></span></div>

  </div>`;
}

/* ---------- Saitenregal ---------- */
/* Härten, mit denen genau diese Saite gezogen wurde – längs wie quer */
function stringTensions(s){
  const out=[];
  jobsWithString(s.id).forEach(j=>{
    if(j.mainId===s.id) out.push(+j.tMain);
    if(isHybrid(j)? j.crossId===s.id : (j.mainId===s.id && isSplit(j))) out.push(+j.tCross);
  });
  return out.filter(n=>!isNaN(n));
}

function shelfRow(s){
  const used = jobsWithString(s.id);
  const kgs = stringTensions(s);
  const rem = stringRemaining(s), pct = s.roll? Math.round(rem/s.roll*100) : null;
  const cls = pct==null? "" : pct<10? "crit" : pct<25? "low" : "";
  return `<div class="shelf-row" data-string="${s.id}" role="button" tabindex="0">
    <div class="swatch" style="background:${esc(s.color||"#888")}"></div>
    <div style="min-width:0">
      <div style="font-family:var(--f-display);font-size:17px;font-weight:700">${esc(s.brand)} ${esc(s.model)}</div>
      <div class="meta" style="font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        ${typeChip(s)}<span class="num">${gmm(s.gauge)} mm</span>
        <span style="color:var(--faint)">·</span><span>${used.length}× verwendet</span>
        ${kgs.length? `<span style="color:var(--faint)">·</span><span class="num">Ø ${fmtKg(Math.round(avg(kgs)*10)/10)} kg</span>`:""}
      </div>
      ${s.roll? `<div style="margin-top:8px;max-width:280px"><div class="bar ${cls}"><i style="width:${pct}%"></i></div>
        <div class="stat-inline" style="margin-top:4px"><b>${rem.toFixed(1).replace(".",",")}</b> von ${s.roll} m auf der Rolle${pct<25?" — bald nachbestellen":""}</div></div>`
       : s.own!==false? `<div class="stat-inline" style="margin-top:6px;color:var(--faint)">Einzelset – keine Rollenlänge hinterlegt</div>`:""}
    </div>
    <div style="text-align:right;color:var(--faint)">›</div>
  </div>`;
}

function viewStrings(){
  const srt = a => [...a].sort((x,y)=> jobsWithString(y.id).length-jobsWithString(x.id).length || x.brand.localeCompare(y.brand));
  const mine = srt(S.strings.filter(s=>s.own!==false));
  const theirs = srt(S.strings.filter(s=>s.own===false));
  const rolls = mine.filter(s=>s.roll);
  const totalM = rolls.reduce((a,s)=>a+stringRemaining(s),0);

  return `
  <div class="section-head" style="margin-top:4px"><h2>Eigene Rollen</h2><span class="rule"></span>
    <button class="btn btn-sm" id="addString">＋ Saite</button></div>
  ${mine.length? `<div class="ledger">${mine.map(shelfRow).join("")}</div>
    <p class="list-note">${rolls.length? `Noch <b class="num">${totalM.toFixed(1).replace(".",",")} m</b> auf ${rolls.length} ${plural(rolls.length,"Rolle","Rollen")} – der Verbrauch jeder Bespannung wird automatisch abgezogen.`
      : "Rollenlänge hinterlegen → der Verbrauch jeder Bespannung wird automatisch abgezogen."}</p>`
   : `<p style="color:var(--muted);font-size:13.5px">Noch keine eigene Saite im Regal.</p>`}

  <div class="section-head"><h2>Saiten vom Spieler</h2><span class="rule"></span></div>
  ${theirs.length? `<div class="ledger">${theirs.map(shelfRow).join("")}</div>
    <p class="list-note">Mitgebracht – zählt nicht gegen deinen Bestand, wird aber im Archiv mitgeführt.</p>`
   : `<p style="color:var(--muted);font-size:13.5px">Noch keine mitgebrachte Saite. Beim Anlegen einer Saite auf „Saite vom Spieler“ stellen.</p>`}`;
}
function stringDetail(s){
  const used = jobsWithString(s.id);
  const kgs = stringTensions(s);
  const asMain = used.filter(j=>j.mainId===s.id).length, asCross = used.filter(j=>j.crossId===s.id).length;
  const rem = stringRemaining(s), mine = s.own!==false;
  const farbe = SAITENFARBEN.find(c=>c[1].toLowerCase()===String(s.color).toLowerCase());
  return `<div class="mbody">
    <div class="kpis" style="margin-bottom:18px">
      ${kpi(used.length,"","Bespannungen", `${asMain}× längs · ${asCross}× quer`)}
      ${kpi(kgs.length? fmtKg(Math.round(avg(kgs)*10)/10):"–","kg","Ø Härte", kgs.length? `${fmtKg(Math.min(...kgs))}–${fmtKg(Math.max(...kgs))} kg`:"")}
      ${kpi(new Set(used.map(j=>j.playerId)).size,"","Spieler","")}
      ${!mine? kpi("—","","Vom Spieler","wird mitgebracht, kein Bestand")
        : s.roll? kpi(rem.toFixed(1).replace(".",","),"m","Rest auf Rolle", `Rolle ${s.roll} m${s.rollOpened?", offen seit "+fmtDate(s.rollOpened):""}`)
                : kpi("–","","Eigene Rolle","keine Rollenlänge hinterlegt")}
    </div>
    <dl class="dl" style="margin-bottom:18px">
      <dt>Herkunft</dt><dd>${mine? "Eigene Rolle" : "Saite vom Spieler"}</dd>
      <dt>Typ</dt><dd>${(TYPES[s.type]||{}).label||s.type}</dd>
      <dt>Stärke</dt><dd class="num">${gmm(s.gauge)} mm</dd>
      <dt>Farbe</dt><dd><span class="chip"><span class="dot" style="background:${esc(s.color)}"></span>${esc(farbe? farbe[0] : s.color)}</span></dd>
      ${s.note?`<dt>Notiz</dt><dd>${esc(s.note)}</dd>`:""}
    </dl>
    ${mine && s.roll? `<div style="margin-bottom:18px"><button class="btn btn-sm" data-newroll="${s.id}">Neue Rolle angebrochen</button>
      <span class="hint" style="display:inline-block;margin-left:8px">setzt den Zähler auf ${s.roll} m zurück</span></div>`:""}
    <div class="section-head" style="margin-top:0"><h2>Damit bespannt</h2><span class="rule"></span></div>
    ${used.length? `<div class="ledger">${ledgerRows(used,{noMonths:true})}</div>`:`<p style="color:var(--muted)">Noch nicht verwendet.</p>`}
  </div>`;
}

/* ---------- Statistik ---------- */
function viewStats(){
  const all = jobsSorted();
  const js = statScope==="ich"    ? all.filter(j=>isMe(j.playerId))
           : statScope==="andere" ? all.filter(j=>!isMe(j.playerId))
           : all;
  const kgs = js.flatMap(tensions).filter(n=>!isNaN(n));
  const year = todayISO().slice(0,4);
  const thisYear = js.filter(j=>j.date.startsWith(year));
  const revenue = js.reduce((a,j)=>a+(+j.price||0),0);
  const open = js.filter(j=>!j.paid).reduce((a,j)=>a+(+j.price||0),0);
  const forOthers = all.filter(j=>!isMe(j.playerId)).length;
  const scopeSub = statScope==="ich"? "nur eigene Schläger"
                 : statScope==="andere"? "nur fremde Schläger"
                 : `${forOthers} davon für andere`;

  // 12-Monats-Verlauf
  const months = [];
  const now = new Date();
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`,lb:MONTHS_S[d.getMonth()],yr:d.getFullYear()}); }
  months.forEach(m=> m.n = js.filter(j=>j.date.startsWith(m.key)).length);
  const maxM = Math.max(1,...months.map(m=>m.n));

  // Ranglisten
  const sc={}, pc={}, rc={};
  js.forEach(j=>{ [j.mainId,j.crossId].filter(Boolean).forEach(id=>sc[id]=(sc[id]||0)+1);
    pc[j.playerId]=(pc[j.playerId]||0)+1; rc[j.racketId]=(rc[j.racketId]||0)+1; });
  const topS = Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topP = Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topR = Object.entries(rc).sort((a,b)=>b[1]-a[1]).slice(0,6);
  // Bei „Nur ich" ist eine Spieler-Rangliste sinnlos – dann zählen die Schläger
  const second = statScope==="ich"
    ? {title:"Deine Schläger", rows:topR, name:rName, tag:()=>""}
    : {title:"Wer wird am meisten bespannt", rows:topP, name:pName,
       tag:id=>isMe(id)?' <span class="tag">eigen</span>':""};

  // Härte-Histogramm
  const buckets = {};
  kgs.forEach(k=>{ const b=Math.floor(k); buckets[b]=(buckets[b]||0)+1; });
  const bKeys = Object.keys(buckets).map(Number).sort((a,b)=>a-b);
  const maxB = Math.max(1,...Object.values(buckets));

  return `
  <div class="scopebar">
    <div class="seg" id="statScope">
      <button type="button" data-scope="alle"   aria-pressed="${statScope==="alle"}">Alle</button>
      <button type="button" data-scope="ich"    aria-pressed="${statScope==="ich"}">Nur ich</button>
      <button type="button" data-scope="andere" aria-pressed="${statScope==="andere"}">Nur andere</button>
    </div>
    <span class="hint" style="margin:0">${statScope==="alle"? "Alle Bespannungen zusammen"
      : statScope==="ich"? "Nur deine eigenen Schläger" : "Nur Bespannungen für andere Spieler"}</span>
  </div>

  <section class="kpis">
    ${kpi(js.length,"","Bespannungen", js.length? `seit ${fmtDate(js[js.length-1].date)}`:"noch keine")}
    ${kpi(thisYear.length,"",`Im Jahr ${year}`, scopeSub)}
    ${kpi(kgs.length? fmtKg(Math.round(avg(kgs)*10)/10):"–","kg","Ø Härte", kgs.length? lbs(avg(kgs))+" lbs":"")}
    ${kpi(revenue? eur(revenue).replace(" €",""):"0,00","€","Umsatz", open>0? eur(open)+" offen":"alles bezahlt")}
  </section>

  <div class="section-head"><h2>Letzte 12 Monate</h2><span class="rule"></span></div>
  <div class="panel" style="padding:16px 18px 12px">
    <div class="monthchart">
      ${months.map(m=>`<div class="mbar">
        <span class="ct">${m.n||""}</span>
        <div class="fill ${m.n?"":"zero"}" style="height:${m.n? Math.max(4,m.n/maxM*100):2}%"></div>
        <span class="lb">${m.lb}</span></div>`).join("")}
    </div>
  </div>

  <div class="grid c2" style="margin-top:22px">
    <div class="panel" style="padding:17px 19px">
      <div class="eyebrow" style="margin-bottom:14px">Meistgenutzte Saiten</div>
      ${topS.length? `<div class="rank">${topS.map(([id,n])=>{
        const s=strg(id)||{};
        return `<div class="r"><span>${esc(sName(id))} <span class="tag">${(TYPES[s.type]||{}).label||""}</span></span>
          <span class="num">${n}×</span><span class="track"><i style="width:${n/topS[0][1]*100}%;background:${esc(s.color||"var(--accent)")}"></i></span></div>`;
      }).join("")}</div>`:`<p style="color:var(--muted);margin:0">Noch keine Daten.</p>`}
    </div>
    <div class="panel" style="padding:17px 19px">
      <div class="eyebrow" style="margin-bottom:14px">${esc(second.title)}</div>

/* ══════════ Modal-System ══════════ */
let modalStack = [];
function openModal(html, opts){
  opts = opts||{};
  const wrap = document.createElement("div");
  wrap.className = "backdrop";
  wrap.innerHTML = `<div class="modal ${opts.wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(opts.title||"Dialog")}">
    <div class="mhead"><h2>${esc(opts.title||"")}</h2>
      ${opts.headExtra||""}
      <button class="iconbtn" data-close="1" aria-label="Schließen">✕</button></div>
    ${html}
    ${opts.foot? `<div class="mfoot">${opts.foot}</div>`:""}
  </div>`;
  $("#modalRoot").appendChild(wrap);
  modalStack.push(wrap);
  wrap.addEventListener("mousedown", e=>{ if(e.target===wrap) closeModal(); });
  document.body.style.overflow="hidden";
  if(opts.onMount) opts.onMount(wrap);
  const f = wrap.querySelector("input,select,textarea,button:not([data-close])"); if(f&&opts.focus!==false) f.focus();
  return wrap;
}
function closeModal(){
  const w = modalStack.pop(); if(w) w.remove();
  if(!modalStack.length) document.body.style.overflow="";
}
function closeAllModals(){ while(modalStack.length) closeModal(); }
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && modalStack.length) closeModal(); });

function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function confirmDialog(title, text, onYes, yesLabel){
  openModal(`<div class="mbody"><p style="margin:0;color:var(--muted)">${esc(text)}</p></div>`, {
    title, foot:`<button class="btn" data-close="1">Abbrechen</button>
      <button class="btn btn-danger" id="cfYes">${esc(yesLabel||"Löschen")}</button>`,
    onMount(w){ w.querySelector("#cfYes").onclick=()=>{ closeModal(); onYes(); }; }
  });
}

/* Saiten-Auswahl, getrennt nach eigenem Bestand und mitgebrachten Saiten */
function stringOptions(sel){
  const grp = (label,arr) => arr.length
    ? `<optgroup label="${label}">`+arr.map(s=>
        `<option value="${s.id}" ${sel===s.id?"selected":""}>${esc(s.brand)} ${esc(s.model)} · ${gmm(s.gauge)}</option>`).join("")+`</optgroup>`
    : "";
  return grp("Eigene Rolle", S.strings.filter(s=>s.own!==false))
       + grp("Saite vom Spieler", S.strings.filter(s=>s.own===false))
       + `<option value="__new">＋ Neue Saite …</option>`;
}

function jobForm(job, prefill){
  const isNew = !job;
  const j = job || Object.assign(
    {id:null,date:todayISO(),playerId:S.settings.ownerId,racketId:"",mainId:"",crossId:"",
     tMain:24,tCross:23,mainM:S.settings.defaultMeters,crossM:0,reason:REASONS[0],price:"",paid:true,note:""},

  const body = () => {
    const rs = S.rackets.filter(r=> r.ownerId===j.playerId);
    return `<div class="mbody">
      <div class="row c2">
        <div class="field"><label for="jDate">Datum</label><input type="date" id="jDate" value="${j.date}"></div>
        <div class="field"><label for="jPlayer">Spieler</label>

            <option value="__new">＋ Neuer Spieler …</option></select></div>
      </div>
      <div class="field"><label for="jRacket">Schläger</label>
        <select id="jRacket">
          ${rs.length? "":`<option value="">– kein Schläger hinterlegt –</option>`}
          ${rs.map(r=>`<option value="${r.id}" ${j.racketId===r.id?"selected":""}>${esc(r.brand)} ${esc(r.model)} · ${r.mains}×${r.crosses}</option>`).join("")}
          <option value="__new">＋ Neuer Schläger …</option></select>
        <div class="hint">Zeigt die Schläger von ${esc(pName(j.playerId))}.</div></div>

      <div class="field"><label>Bespannung</label>
        <div class="seg" id="jSeg">
          <button type="button" data-hy="0" aria-pressed="${!hybrid}">Eine Saite</button>
          <button type="button" data-hy="1" aria-pressed="${hybrid}">Hybrid</button>
        </div></div>

      <div class="field"><label for="jMain">${hybrid?"Längssaite (Mains)":"Saite"}</label>
        <select id="jMain">${stringOptions(j.mainId)}</select></div>

      <div class="field" id="crossWrap" style="${hybrid?"":"display:none"}">
        <label for="jCross">Quersaite (Crosses)</label>
        <select id="jCross">${stringOptions(j.crossId)}</select></div>

      <div class="field"><label>Härte</label>
        <div class="tension">
          <div><span class="tlabel">Längs</span>
            <input type="number" id="jTMain" step="0.25" min="10" max="40" value="${j.tMain}"></div>
          <span class="tslash">/</span>
          <div><span class="tlabel">Quer</span>
            <input type="number" id="jTCross" step="0.25" min="10" max="40" value="${j.tCross===""||j.tCross==null? j.tMain : j.tCross}"></div>
          <span class="tunit">kg</span>
        </div>
        <div class="hint" id="hintMain"></div></div>

      <div class="row c3">
        <div class="field"><label for="jMainM">${hybrid?"Verbrauch längs (m)":"Verbrauch (m)"}</label><input type="number" id="jMainM" step="0.5" min="0" value="${j.mainM}"></div>
        <div class="field" id="crossMWrap" style="${hybrid?"":"display:none"}"><label for="jCrossM">Verbrauch quer (m)</label>
          <input type="number" id="jCrossM" step="0.5" min="0" value="${j.crossM||S.settings.defaultCrossM}"></div>
        <div class="field"><label for="jReason">Anlass</label>
          <select id="jReason">${REASONS.map(r=>`<option ${j.reason===r?"selected":""}>${r}</option>`).join("")}</select></div>
      </div>

      <div class="row c2">
        <div class="field"><label for="jPrice">Preis (€)</label><input type="number" id="jPrice" step="0.5" min="0" placeholder="leer lassen wenn kostenlos" value="${j.price}"></div>
        <div class="field"><label>Zahlung</label>
          <label class="checkline" style="padding-top:8px"><input type="checkbox" id="jPaid" ${j.paid?"checked":""}> bezahlt</label></div>
      </div>
      <div class="field"><label for="jNote">Notiz</label>
        <textarea id="jNote" rows="2" placeholder="z. B. Vorreck 10 %, Knoten weich, Wunsch: 0,5 kg fester">${esc(j.note)}</textarea></div>
    </div>`;
  };

  const w = openModal(body(), {
    title: isNew? "Neue Bespannung":"Bespannung bearbeiten", wide:true,
    foot:`${!isNew? `<button class="btn btn-danger btn-sm spacer" id="jDelete">Löschen</button>`:'<span class="spacer"></span>'}
      <button class="btn" data-close="1">Abbrechen</button>
      <button class="btn btn-primary" id="jSave">${isNew?"Eintragen":"Speichern"}</button>`,
    onMount: wire
  });

  function wire(w){
    const q = s => w.querySelector(s);
    const rerender = () => { w.querySelector(".mbody").outerHTML = body(); wire(w); };

    q("#jSeg").onclick = e=>{ const b=e.target.closest("[data-hy]"); if(!b) return;
      hybrid = b.dataset.hy==="1"; sync(); rerender(); };

    function sync(){
      j.date=q("#jDate").value; j.playerId=q("#jPlayer").value;
      if(q("#jRacket").value!=="__new") j.racketId=q("#jRacket").value;
      if(q("#jMain").value!=="__new") j.mainId=q("#jMain").value;
      j.tMain=+q("#jTMain").value; j.tCross=+q("#jTCross").value; j.mainM=+q("#jMainM").value;
      if(hybrid){ const c=q("#jCross"); if(c&&c.value!=="__new") j.crossId=c.value;
        j.crossM=+q("#jCrossM").value; }
      else { j.crossId=""; j.crossM=0; }
      j.reason=q("#jReason").value; j.price=q("#jPrice").value; j.paid=q("#jPaid").checked; j.note=q("#jNote").value;
    }

    q("#jPlayer").onchange = e=>{
      if(e.target.value==="__new"){ e.target.value=j.playerId;
        playerForm(null, p=>{ j.playerId=p.id; j.racketId=""; rerender(); }); return; }
      sync(); j.racketId=""; rerender();
    };
    q("#jRacket").onchange = e=>{
      if(e.target.value==="__new"){ e.target.value=j.racketId;
        racketForm(null, r=>{ j.racketId=r.id; j.playerId=r.ownerId; rerender(); }, j.playerId); return; }
      j.racketId=e.target.value;
    };
    ["#jMain","#jCross"].forEach(sel=>{ const el=q(sel); if(!el) return;
      el.onchange = e=>{
        if(e.target.value==="__new"){ e.target.value = sel==="#jMain"? j.mainId : j.crossId;
          stringForm(null, s=>{ if(sel==="#jMain") j.mainId=s.id; else j.crossId=s.id; sync(); rerender(); }); return; }
        if(sel==="#jMain") j.mainId=e.target.value; else j.crossId=e.target.value;
        hintTension();
      };
    });

    function hintTension(){
      const h=q("#hintMain"); if(!h) return;
      const a=+q("#jTMain").value, b=+q("#jTCross").value;
      h.textContent = !a? "" : (a===b? `${lbs(a)} lbs` : `${lbs(a)} / ${lbs(b)} lbs · geteilte Bespannung`);
    }
    // Quer folgt der Längshärte, solange beide gleich stehen
    let prevMain = +q("#jTMain").value;
    q("#jTMain").oninput = ()=>{
      const cur=+q("#jTMain").value, cross=q("#jTCross");
      if(cross && +cross.value===prevMain) cross.value=cur;
      prevMain=cur; hintTension();
    };
    q("#jTCross").oninput = hintTension;
    hintTension();

    // Vorbelegung: letzte Bespannung dieses Schlägers
    if(isNew && !j.racketId){
      const rs = S.rackets.filter(r=>r.ownerId===j.playerId);
      if(rs.length) { j.racketId = rs[0].id; q("#jRacket").value = rs[0].id; }
    }
    if(isNew && !j.mainId && S.strings.length){ j.mainId=S.strings[0].id; q("#jMain").value=j.mainId; }

    const del = q("#jDelete");
    if(del) del.onclick = ()=> confirmDialog("Bespannung löschen?",
      `${pName(j.playerId)} · ${fmtDate(j.date)} · ${fmtKg(j.tMain)} kg wird aus dem Archiv entfernt.`,
      ()=>{ S.jobs = S.jobs.filter(x=>x.id!==j.id); save(); closeAllModals(); render(); toast("Eintrag gelöscht"); });

    q("#jSave").onclick = ()=>{
      sync();
      if(!j.racketId){ toast("Bitte einen Schläger wählen oder anlegen"); return; }
      if(!j.mainId){ toast("Bitte eine Saite wählen"); return; }
      if(!j.tMain || j.tMain<10 || j.tMain>40){ toast("Härte längs prüfen (10–40 kg)"); return; }
      if(!j.tCross || j.tCross<10 || j.tCross>40){ toast("Härte quer prüfen (10–40 kg)"); return; }
      const rec = {...j, price: j.price===""? 0 : +j.price};
      if(!hybrid){ rec.crossId=""; rec.crossM=0; }
      if(isNew){ rec.id=uid(); rec.createdAt=new Date().toISOString(); S.jobs.push(rec); }
      else { const i=S.jobs.findIndex(x=>x.id===j.id); S.jobs[i]={...S.jobs[i],...rec}; }
      save(); closeAllModals(); render();
      toast(isNew? `Eingetragen: ${pName(rec.playerId)} · ${fmtKg(rec.tMain)} kg` : "Gespeichert");
    };
  }
}

    <div class="field"><label>Herkunft</label>

    <div class="row c2" id="rollWrap" style="${own?"":"display:none"}">
      <div class="field"><label for="sRoll">Rollenlänge (m)</label><input type="number" id="sRoll" min="0" max="400" value="${d.roll||""}" placeholder="z. B. 200 – leer = Einzelset"></div>
      <div class="field"><label for="sOpened">Rolle offen seit</label><input type="date" id="sOpened" value="${d.rollOpened||""}">
        <div class="hint">Nur Bespannungen ab diesem Tag zählen.</div></div>
    </div>
    <div class="field"><label for="sNote">Notiz</label><textarea id="sNote" rows="2" placeholder="Spannungsverlust hoch, gut für Aufsteiger …">${esc(d.note)}</textarea></div>
  </div>`,{
    title:isNew?"Neue Saite":"Saite bearbeiten",
    foot:`${!isNew? `<button class="btn btn-danger btn-sm spacer" id="sDel">Löschen</button>`:'<span class="spacer"></span>'}
      <button class="btn" data-close="1">Abbrechen</button><button class="btn btn-primary" id="sSave">Speichern</button>`,

        q("#sColor").value = hex;
        w.querySelectorAll("#sColors .sw[data-color]").forEach(b=>
          b.setAttribute("aria-pressed", b.dataset.color.toLowerCase()===hex.toLowerCase()));
        const n = SAITENFARBEN.find(c=>c[1].toLowerCase()===hex.toLowerCase());
        q("#sColorName").textContent = n? n[0] : hex;
        if(!fromPicker) q("#sColorPick").value = hex;
      }
      q("#sColors").onclick = e=>{ const b=e.target.closest("[data-color]"); if(b) setColor(b.dataset.color); };
      q("#sColorPick").oninput = e=> setColor(e.target.value, true);

      q("#sOwn").onclick = e=>{
        const b=e.target.closest("[data-own]"); if(!b) return;
        own = b.dataset.own==="1";
        w.querySelectorAll("#sOwn button").forEach(x=>x.setAttribute("aria-pressed", (x.dataset.own==="1")===own));
        q("#rollWrap").style.display = own? "" : "none";
      };

      const dl=q("#sDel");
      if(dl) dl.onclick=()=>{
        const used=jobsWithString(s.id).length;
        if(used){ toast(`Saite steckt in ${used} ${plural(used,"Bespannung","Bespannungen")} – nicht löschbar`); return; }
        confirmDialog("Saite löschen?",`${s.brand} ${s.model} aus dem Regal entfernen.`,
          ()=>{ S.strings=S.strings.filter(x=>x.id!==s.id); save(); closeAllModals(); render(); toast("Saite gelöscht"); });
      };
      q("#sSave").onclick=()=>{
        const brand=q("#sBrand").value.trim(), model=q("#sModel").value.trim();
        if(!brand&&!model){ toast("Marke oder Modell angeben"); return; }
        let color=q("#sColor").value.trim();
        if(!/^#[0-9a-f]{6}$/i.test(color)) color="#999999";
        const roll = own && q("#sRoll").value? +q("#sRoll").value : null;
        const rec={brand,model,type:q("#sType").value,gauge:+q("#sGauge").value||1.25,color,own,
          roll, rollOpened: roll? (q("#sOpened").value||todayISO()) : null, note:q("#sNote").value.trim()};
        let out;
        if(isNew){ out={id:uid(),...rec}; S.strings.push(out); }
        else { const i=S.strings.findIndex(x=>x.id===s.id); S.strings[i]={...S.strings[i],...rec}; out=S.strings[i]; }
        save(); closeModal(); if(cb) cb(out); else { render(); toast("Gespeichert"); }
      };
    }
  });
}
