/* ══════════ GitHub-Abgleich ══════════════════════════════════════════
   Wie bei NOVA: die Contents-API des Repos, ein persönlicher Token im
   Browser. Der Token liegt bewusst unter einem eigenen Schlüssel und
   niemals im Archiv – so wandert er auch bei „Sichern“ nicht in die Datei. */
const GH_CFG="saitenbuch_gh", GH_TOK="saitenbuch_gh_token";
const ghStandard={user:"mattiknp", repo:"routine-tracker", file:"saitenbuch.json", on:false};

function ghCfg(){
  try{ return Object.assign({},ghStandard,JSON.parse(localStorage.getItem(GH_CFG)||"{}")); }
  catch(e){ return {...ghStandard}; }
}
function ghSetCfg(c){ try{ localStorage.setItem(GH_CFG,JSON.stringify(c)); }catch(e){} }
function ghTok(){ try{ return (localStorage.getItem(GH_TOK)||"").trim(); }catch(e){ return ""; } }
function ghSetTok(t){ t=String(t||"").trim(); try{ t? localStorage.setItem(GH_TOK,t) : localStorage.removeItem(GH_TOK); }catch(e){} }
function ghUrl(){ const c=ghCfg(); return `https://api.github.com/repos/${c.user}/${c.repo}/contents/${encodeURIComponent(c.file)}`; }
/* Classic-Token (ghp_…) wollen „token …“, feingranulare (github_pat_…) mögen beides.
   NOVA nutzt „token“ – deshalb ist das der Standard, mit Rückfall auf „Bearer“ bei 401. */
let ghScheme = "token";
function ghTyp(){
  const t = ghTok();
  if(/^ghp_/.test(t)) return "classic";
  if(/^github_pat_/.test(t)) return "fein";
  if(/^gh[oustr]_/.test(t)) return "andere";
  return t? "unbekannt" : "keiner";
}
async function ghFetch(url, opt){
  opt = opt || {};
  const mit = sch => Object.assign({}, opt, {headers: Object.assign({}, opt.headers||{}, {
    Authorization: sch+" "+ghTok(),
    Accept: "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  })});
  let r = await fetch(url, mit(ghScheme));
  if(r.status === 401){                       // Schema wechseln und ein zweites Mal versuchen
    const anders = ghScheme === "token" ? "Bearer" : "token";
    const r2 = await fetch(url, mit(anders));
    if(r2.status !== 401){ ghScheme = anders; return r2; }
  }
  return r;
}
function ghAktiv(){ const c=ghCfg(); return !!(c.on && ghTok() && c.user && c.repo && c.file); }
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))));

let syncState="off", syncText="Nicht verbunden", syncSha=null, syncTimer=null;
function setSync(state,text){ syncState=state; syncText=text||""; paintSync(); }
function paintSync(){
  const dot=$("#syncDot"); if(!dot) return;
  dot.style.background = {ok:"var(--good)",busy:"var(--warn)",err:"var(--bad)",off:"var(--faint)"}[syncState]||"var(--faint)";
  const b=$("#btnGh"); if(b) b.title = "GitHub-Abgleich – "+(syncText||"nicht verbunden");
}
function queueSync(){
  if(!ghAktiv()) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(pushCloud,1500);
}

/* Ein fetch, der ohne Statuscode scheitert, heißt fast immer: die Umgebung
   lässt keine fremden Server zu (im veröffentlichten Artefakt der Fall). */
function ghFehler(e){
  if(e && e.status) return "GitHub antwortet mit "+e.status;
  return "gesperrt";
}

async function pushCloud(){
  if(!ghAktiv()) return false;
  setSync("busy","Lädt hoch …");
  try{
    let sha=syncSha;
    if(!sha){
      const r=await ghFetch(ghUrl()+"?v="+Date.now());
      if(r.ok) sha=(await r.json()).sha;
      else if(r.status!==404){ const err=new Error("http"); err.status=r.status; throw err; }
    }
    const inhalt = b64enc(JSON.stringify(S,null,2));
    const bau = s => ({method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message:`Saitenbuch · ${S.jobs.length} Bespannungen · ${todayISO()}`,
        content:inhalt, ...(s?{sha:s}:{})})});
    let r2=await ghFetch(ghUrl(),bau(sha));
    if(r2.status===409 || r2.status===422){        // fremder Stand dazwischen: sha neu holen
      const r3=await ghFetch(ghUrl()+"?v="+Date.now());
      if(r3.ok) r2=await ghFetch(ghUrl(),bau((await r3.json()).sha));
    }
    if(!r2.ok){ const err=new Error("http"); err.status=r2.status; throw err; }
    syncSha=(await r2.json()).content.sha;
    ensureMeta(S); S.meta.syncedAt=new Date().toISOString(); S.meta.changes=0; persist();
    setSync("ok","Auf GitHub gesichert"); renderBanner();
    return true;
  }catch(e){
    const t=ghFehler(e);
    setSync("err", t==="gesperrt"? "Zugriff auf GitHub hier gesperrt" : t);
    renderBanner();
    return false;
  }
}

async function pullCloud(opts){
  opts=opts||{};
  if(!ghAktiv()) return false;
  setSync("busy","Lädt …");
  try{
    const r=await ghFetch(ghUrl()+"?v="+Date.now());
    if(r.status===404){ setSync("busy","Datei liegt noch nicht im Repo");
      if(opts.laut) toast("Noch keine Datei im Repo – „Jetzt hochladen“ legt sie an"); return false; }
    if(!r.ok){ const err=new Error("http"); err.status=r.status; throw err; }
    const j=await r.json(); syncSha=j.sha;
    const p=JSON.parse(b64dec(j.content));
    if(!p || !Array.isArray(p.players) || !Array.isArray(p.jobs)) throw new Error("Aufbau");

    const uebernehmen = ()=>{
      S=ensureMeta(migrate(p)); S.meta.syncedAt=new Date().toISOString(); S.meta.changes=0;
      loadProblem=null; persist(); setSync("ok","Synchron"); render();
      toast(`Von GitHub geladen: ${S.jobs.length} ${plural(S.jobs.length,"Bespannung","Bespannungen")}`);
    };
    // Niemals stillschweigend mehr Einträge verwerfen, als hereinkommen
    if(p.jobs.length < S.jobs.length){
      setSync("err","GitHub-Stand ist kleiner");
      confirmDialog("GitHub-Stand hat weniger Einträge",
        `Auf GitHub liegen ${p.jobs.length}, hier ${S.jobs.length} ${plural(S.jobs.length,"Bespannung","Bespannungen")}. `+
        `Übernehmen würde ${S.jobs.length-p.jobs.length} verwerfen. Umgekehrt lädst du mit „Jetzt hochladen“ deinen Stand hoch.`,
        uebernehmen, "Trotzdem übernehmen");
      return false;
    }
    uebernehmen();
    return true;
  }catch(e){
    const t=ghFehler(e);
    setSync("err", t==="gesperrt"? "Zugriff auf GitHub hier gesperrt" : t);
    if(opts.laut) toast(t==="gesperrt"
      ? "Diese Ansicht lässt keinen Zugriff auf GitHub zu – Datei lokal öffnen"
      : t);
    renderBanner();
    return false;
  }
}

/* Prüft Schritt für Schritt und nennt bei jedem Fehler die konkrete Abhilfe.
   Bei Classic-Token verrät GitHub die vergebenen Scopes im Kopf „x-oauth-scopes“. */
async function ghPruefen(){
  const c = ghCfg();
  const zeilen = [];
  const zeile = (ok,titel,text) => zeilen.push(
    `<div class="pz ${ok===true?"gut":ok===false?"schlecht":"neutral"}">
       <span class="pzi">${ok===true?"✓":ok===false?"✗":"·"}</span>
       <span><b>${esc(titel)}</b>${text? `<br><span style="color:var(--muted)">${text}</span>`:""}</span>
     </div>`);
  const zeigen = () => {
    const b=$("#pruefRaus"); if(b) b.innerHTML = zeilen.join("");
  };

  openModal(`<div class="mbody"><div id="pruefRaus" class="pruef">
    <div class="pz neutral"><span class="pzi">·</span><span>Prüfe …</span></div></div></div>`,
    {title:"Verbindung prüfen", wide:true,
     foot:`<button class="btn" data-close="1">Schließen</button>
           <button class="btn btn-primary" id="pruefNochmal">Nochmal prüfen</button>`,
     onMount(w){ w.querySelector("#pruefNochmal").onclick=()=>{ closeModal(); ghPruefen(); }; }});

  // 1 – Token da und welcher Typ
  const typ = ghTyp();
  if(typ==="keiner"){
    zeile(false,"Kein Token hinterlegt","Im GitHub-Fenster eintragen und auf „Verbinden“ klicken.");
    zeigen(); return;
  }
  zeile(true, {classic:"Classic-Token erkannt (ghp_…)", fein:"Feingranularer Token erkannt (github_pat_…)",
    andere:"GitHub-Token erkannt", unbekannt:"Token mit unbekanntem Anfang"}[typ],
    typ==="unbekannt"? "Beginnt weder mit ghp_ noch mit github_pat_ – vollständig kopiert?" : "");
  zeigen();

  // 2 – Wer bin ich, und welche Rechte hat der Token
  let anmeldung = null, scopes = null;
  try{
    const r = await ghFetch("https://api.github.com/user");
    if(r.status===401){
      zeile(false,"GitHub lehnt den Token ab (401)","Token abgelaufen, widerrufen oder unvollständig kopiert. Am besten neu erzeugen.");
      zeigen(); return;
    }
    if(!r.ok){ zeile(false,"GitHub antwortet mit "+r.status,""); zeigen(); return; }
    anmeldung = await r.json();
    scopes = r.headers.get("x-oauth-scopes");
    zeile(true,"Angemeldet als "+esc(anmeldung.login), "Schema: Authorization: "+ghScheme);
    if(typ==="classic"){
      const liste = (scopes||"").split(",").map(x=>x.trim()).filter(Boolean);
      const hatRepo = liste.includes("repo");
      zeile(hatRepo, hatRepo? "Scope „repo“ vorhanden" : "Scope „repo“ fehlt",
        liste.length? "Vergeben: "+esc(liste.join(", ")) + (hatRepo? "" :
          " — im Token die Box <b>repo</b> ankreuzen (nicht nur public_repo), sonst bleibt ein privates Repo unsichtbar.")
        : "Der Token hat gar keine Scopes — deshalb sieht er kein einziges Repo. Neu erzeugen und <b>repo</b> ankreuzen.");
    }
    if(anmeldung.login && c.user && anmeldung.login.toLowerCase()!==c.user.toLowerCase())
      zeile(false,"Benutzername weicht ab",
        `Der Token gehört zu <b>${esc(anmeldung.login)}</b>, im Feld steht <b>${esc(c.user)}</b>. Feld anpassen.`);
    zeigen();
  }catch(e){
    zeile(false,"Kein Zugriff auf GitHub",
      "Diese Ansicht darf keine fremden Server ansprechen. Öffne die Datei ~/Claude/Artifacts/saitenbuch/index.html direkt im Browser.");
    zeigen(); return;
  }

  // 3 – Repo sichtbar und beschreibbar
  try{
    const r = await ghFetch(`https://api.github.com/repos/${c.user}/${c.repo}`);
    if(r.status===404){
      zeile(false,`Repo ${esc(c.user)}/${esc(c.repo)} nicht auffindbar`,
        typ==="classic"
          ? "Entweder heißt es anders, oder dem Classic-Token fehlt der Scope <b>repo</b> — bei privaten Repos antwortet GitHub dann mit 404 statt 403."
          : "Entweder heißt es anders, oder der Token hat dieses Repo nicht freigegeben (Repository access → Only select repositories).");
      zeigen(); return;
    }
    if(r.status===403){
      zeile(false,"Zugriff verweigert (403)","Meist eine Organisationsfreigabe (SSO) oder eine fehlende Berechtigung.");
      zeigen(); return;
    }
    if(!r.ok){ zeile(false,"Repo-Abfrage endet mit "+r.status,""); zeigen(); return; }
    const repo = await r.json();
    zeile(true,`Repo gefunden: ${esc(repo.full_name)}`, repo.private? "privat":"öffentlich");
    const darfSchreiben = repo.permissions && repo.permissions.push;
    zeile(!!darfSchreiben, darfSchreiben? "Schreibrecht vorhanden" : "Kein Schreibrecht",
      darfSchreiben? "" : (typ==="classic"
        ? "Scope <b>repo</b> im Token ankreuzen."
        : "Beim Token unter Permissions → <b>Contents: Read and write</b> setzen."));
    zeigen();
    if(!darfSchreiben) return;
  }catch(e){ zeile(false,"Repo-Abfrage abgebrochen","Zugriff gesperrt."); zeigen(); return; }

  // 4 – Die Datei selbst
  try{
    const r = await ghFetch(ghUrl()+"?v="+Date.now());
    if(r.status===404) zeile(null,`${esc(c.file)} liegt noch nicht im Repo`,"Wird beim ersten Hochladen angelegt — das ist in Ordnung.");
    else if(r.ok){ const j=await r.json();
      zeile(true,`${esc(c.file)} gefunden`, Math.round((j.size||0)/1024*10)/10+" kB im Repo"); }
    else zeile(false,"Datei-Abfrage endet mit "+r.status,"");
    zeigen();
  }catch(e){ zeile(false,"Datei-Abfrage abgebrochen",""); zeigen(); return; }

  zeile(true,"Alles bereit","„Jetzt hochladen“ im GitHub-Fenster schreibt dein Archiv ins Repo.");
  zeigen();
}

function ghDialog(){
  const c=ghCfg(), hatTok=!!ghTok();
  openModal(`<div class="mbody">
    <p style="margin:0 0 16px;color:var(--muted);font-size:13.5px">
      Das Archiv wird als JSON-Datei in ein GitHub-Repo geschrieben – nach jeder Änderung automatisch.
      Der Token bleibt in diesem Browser und geht nur an GitHub; ins gesicherte Archiv wandert er nie.</p>
    <div class="field"><label for="ghTok">Persönlicher Token</label>
      <input type="password" id="ghTok" placeholder="${hatTok? "gespeichert – zum Ersetzen neu eingeben":"ghp_… oder github_pat_…"}" autocomplete="off">
      <div class="hint">Fine-grained Token, nur dieses Repo, Recht „Contents: Read and write“.</div></div>
    <div class="row c3">
      <div class="field"><label for="ghUser">Benutzer</label><input type="text" id="ghUser" value="${esc(c.user)}"></div>
      <div class="field"><label for="ghRepo">Repo</label><input type="text" id="ghRepo" value="${esc(c.repo)}"></div>
      <div class="field"><label for="ghFile">Datei</label><input type="text" id="ghFile" value="${esc(c.file)}"></div>
    </div>
    <div class="field"><label>Zustand</label>
      <div style="font-size:13.5px;color:var(--muted)">
        ${c.on? (hatTok? "Abgleich eingeschaltet":"Eingeschaltet, aber kein Token hinterlegt") : "Abgleich aus"}
        ${S.meta.syncedAt? ` · zuletzt ${fmtDate(S.meta.syncedAt.slice(0,10))}`:""}
        ${syncText? ` · ${esc(syncText)}`:""}</div></div>
    <p class="hint" style="margin-top:14px">Im veröffentlichten Artefakt sind Zugriffe auf fremde Server oft gesperrt.
      Dann funktioniert der Abgleich, wenn du die Datei
      <span class="num">~/Claude/Artifacts/saitenbuch/index.html</span> direkt im Browser öffnest – wie bei NOVA.</p>
  </div>`,{
    title:"GitHub-Abgleich", wide:true,
    foot:`${ghAktiv()? `<button class="btn btn-danger btn-sm spacer" id="ghOff">Trennen</button>`:'<span class="spacer"></span>'}
      <button class="btn" data-close="1">Abbrechen</button>
      <button class="btn btn-sm" id="ghCheck">Verbindung prüfen</button>
      ${ghAktiv()? `<button class="btn btn-sm" id="ghPull">Von GitHub laden</button>`:""}
      <button class="btn btn-primary" id="ghOn">${ghAktiv()? "Jetzt hochladen":"Verbinden"}</button>`,
    onMount(w){
      const q=x=>w.querySelector(x);
      const merken = ()=>{
        const t=q("#ghTok").value.trim(); if(t) ghSetTok(t);
        ghSetCfg({user:q("#ghUser").value.trim(), repo:q("#ghRepo").value.trim(),
                  file:q("#ghFile").value.trim()||"saitenbuch.json", on:true});
        syncSha=null;
      };
      q("#ghOn").onclick = async ()=>{
        merken();
        if(!ghTok()){ toast("Ohne Token geht es nicht"); return; }
        closeModal();
        const rauf = await pushCloud();
        if(rauf) toast("Mit GitHub verbunden – ab jetzt wird automatisch abgeglichen");
      };
      q("#ghCheck").onclick = ()=>{ merken(); closeModal(); ghPruefen(); };
      const pull=q("#ghPull");
      if(pull) pull.onclick = async ()=>{ merken(); closeModal(); await pullCloud({laut:true}); };
      const off=q("#ghOff");
      if(off) off.onclick = ()=> confirmDialog("GitHub trennen?",
        "Token und Zugangsdaten werden aus diesem Browser entfernt. Die Datei im Repo bleibt liegen.",
        ()=>{ ghSetTok(""); ghSetCfg({...ghCfg(),on:false}); syncSha=null;
              setSync("off","Nicht verbunden"); closeAllModals(); render(); toast("GitHub getrennt"); },
        "Trennen");
    }
  });
}

/* ══════════ Events ══════════ */
document.addEventListener("click", e=>{
  const t = e.target;
  if(t.closest("[data-close]")){ closeModal(); return; }

  const tab = t.closest("[data-tab]");
  if(tab){ route.tab = tab.dataset.tab; render(); return; }

  if(t.closest("#btnNewJob")||t.closest("#btnFirst")){ jobForm(null); return; }
  if(t.closest("#btnDemo")||t.closest("#btnDemo2")){
    confirmDialog("Beispieldaten laden?",
      "Legt drei erfundene Spieler mit Schlägern und zwölf Bespannungen an – nur zum Ausprobieren. "+
      "Sie werden als Beispieldaten markiert und lassen sich unter Statistik → Daten wieder entfernen.",
      ()=>loadDemo(), "Laden"); return;
  }
  if(t.closest("#btnDemoWeg")){ entferneDemo(); return; }
  if(t.closest("#addPlayer")){ playerForm(null); return; }
  if(t.closest("#addRacket")){ racketForm(null); return; }
  if(t.closest("#addString")){ stringForm(null); return; }
  if(t.closest("#fclear")){ F={q:"",player:"",string:"",period:"",kgMin:"",kgMax:"",sort:"date"}; render(); return; }
  const scp = t.closest("[data-scope]");
  if(scp){ statScope = scp.dataset.scope; render(); return; }
  if(t.closest("#btnExport")||t.closest("#bnExport")){ exportBackup(); return; }
  if(t.closest("#btnImport")||t.closest("#bnImport")){ $("#fileImport").click(); return; }
  if(t.closest("#btnRestore")){ restoreBackup(); return; }
  if(t.closest("#bnZu")){ bannerZu=true; renderBanner(); return; }
  if(t.closest("#btnGh")||t.closest("#btnGh2")||t.closest("#bnGh")){ ghDialog(); return; }
  if(t.closest("#btnWipe")){
    confirmDialog("Archiv leeren?",
      `Alle ${S.jobs.length} ${plural(S.jobs.length,"Bespannung","Bespannungen")}, Spieler und Schläger werden gelöscht. `+
      `Übrig bleibt deine Grundausstattung: dein Wilson Blade v9 98 und die beiden Rollen Hyper-G und Pro Line II. `+
      `Über „Stand vor der letzten Änderung“ kommst du danach noch einmal zurück – sicherer ist vorher ⬇ Sichern.`,
      ()=>{ S=ensureMeta(seed()); persist(); route.tab="archiv"; render();
            if(ghAktiv()) pushCloud();      // sonst holt der nächste Start den alten Stand zurück
            toast("Archiv geleert – deine Grundausstattung steht"); }); return;
  }
  const nr = t.closest("[data-newroll]");
  if(nr){ const s=strg(nr.dataset.newroll); if(s){ s.rollOpened=todayISO(); save(); closeAllModals(); render(); toast("Neue Rolle vermerkt"); } return; }

  const jr = t.closest("[data-job]");
  if(jr){ const j=S.jobs.find(x=>x.id===jr.dataset.job); if(j) jobDetail(j); return; }
  const pr = t.closest("[data-player]");
  if(pr){ const p=player(pr.dataset.player); if(p) openModal(playerDetail(p),{title:p.name,wide:true,
    headExtra:`<button class="btn btn-sm" id="edP">Bearbeiten</button>`,
    onMount(w){ w.querySelector("#edP").onclick=()=>{ closeModal(); playerForm(p); }; }}); return; }
  const rr = t.closest("[data-racket]");
  if(rr){ const r=racket(rr.dataset.racket); if(r) openModal(racketDetail(r),{title:`${r.brand} ${r.model}`,wide:true,
    headExtra:`<button class="btn btn-sm" id="edR">Bearbeiten</button>`,
    onMount(w){ w.querySelector("#edR").onclick=()=>{ closeModal(); racketForm(r); }; }}); return; }
  const sr = t.closest("[data-string]");
  if(sr){ const s=strg(sr.dataset.string); if(s) openModal(stringDetail(s),{title:`${s.brand} ${s.model}`,wide:true,
    headExtra:`<button class="btn btn-sm" id="edS">Bearbeiten</button>`,
    onMount(w){ w.querySelector("#edS").onclick=()=>{ closeModal(); stringForm(s); }; }}); return; }
});

document.addEventListener("keydown", e=>{
  if(e.key!=="Enter"&&e.key!==" ") return;
  const el = document.activeElement;
  if(el && el.matches('[role="button"][tabindex="0"]')){ e.preventDefault(); el.click(); }
});

document.addEventListener("input", e=>{
  const id = e.target.id;
  if(id==="fq"){ F.q=e.target.value; const pos=e.target.selectionStart; render();
    const n=$("#fq"); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }
  else if(id==="fkgmin"){ F.kgMin=e.target.value; render(); const n=$("#fkgmin"); if(n) n.focus(); }
  else if(id==="fkgmax"){ F.kgMax=e.target.value; render(); const n=$("#fkgmax"); if(n) n.focus(); }
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if(id==="fplayer"){ F.player=e.target.value; render(); }
  else if(id==="fstring"){ F.string=e.target.value; render(); }
  else if(id==="fperiod"){ F.period=e.target.value; render(); }
  else if(id==="fsort"){ F.sort=e.target.value; render(); }
  else if(id==="fileImport" && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value=""; }
});

/* ══════════ Start ══════════ */
S = load();
render();
if(ghAktiv()){ setSync("busy","Lädt …"); pullCloud(); }
else paintSync();
})();
</script>
