:root{
  --f-ui:"Archivo SB","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
  --topbar-h:60px; --nav-h:64px;
  --lcd-bg:#060908; --lcd-frame:#1B252B; --lcd-on:#C8F04C; --lcd-off:#131C10; --lcd-dim:#7F8F88;
  --ground:#E3E9EB; --surface-1:#F3F6F7; --surface-2:#E8EEF0; --surface-3:#DAE2E6;
  --line:#D0DADE; --line-strong:#B3C0C6;
  --ink:#0D1519; --ink-2:#41525B; --ink-3:#586A74;
  --accent:#C8F04C; --on-accent:#14200A; --accent-text:#3A5008; --focus:#1F2E04; --viz:#617F10;
  --good:#23724A; --warn:#7A4C05; --bad:#A92D2D;
  --poly:#1D6A93; --multi:#9C5210; --gut:#775A1B; --syn:#5642A3; --kev:#A02F2F;
  --shadow:0 1px 1px rgb(13 21 25/.05),0 16px 32px -16px rgb(13 21 25/.30);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{--ground:#0A0F12; --surface-1:#11181C; --surface-2:#182127; --surface-3:#202B32;
  --line:#1F2A31; --line-strong:#33424B;
  --ink:#E8EEF1; --ink-2:#A8B6BE; --ink-3:#7B8B95;
  --accent:#C8F04C; --on-accent:#10190A; --accent-text:#C8F04C; --focus:#C8F04C; --viz:#C8F04C;
  --good:#74D6A0; --warn:#EBB05A; --bad:#F28585;
  --poly:#7FD4FF; --multi:#FFAB6B; --gut:#E9D6AC; --syn:#B9A5FF; --kev:#FF8A8A;
  --shadow:0 1px 1px rgb(0 0 0/.4),0 18px 36px -16px rgb(0 0 0/.85); color-scheme:dark}}
:root[data-theme="light"]{--ground:#E3E9EB; --surface-1:#F3F6F7; --surface-2:#E8EEF0; --surface-3:#DAE2E6;
  --line:#D0DADE; --line-strong:#B3C0C6;
  --ink:#0D1519; --ink-2:#41525B; --ink-3:#586A74;
  --accent:#C8F04C; --on-accent:#14200A; --accent-text:#3A5008; --focus:#1F2E04; --viz:#617F10;
  --good:#23724A; --warn:#7A4C05; --bad:#A92D2D;
  --poly:#1D6A93; --multi:#9C5210; --gut:#775A1B; --syn:#5642A3; --kev:#A02F2F;
  --shadow:0 1px 1px rgb(13 21 25/.05),0 16px 32px -16px rgb(13 21 25/.30); color-scheme:light}
:root[data-theme="dark"]{--ground:#0A0F12; --surface-1:#11181C; --surface-2:#182127; --surface-3:#202B32;
  --line:#1F2A31; --line-strong:#33424B;
  --ink:#E8EEF1; --ink-2:#A8B6BE; --ink-3:#7B8B95;
  --accent:#C8F04C; --on-accent:#10190A; --accent-text:#C8F04C; --focus:#C8F04C; --viz:#C8F04C;
  --good:#74D6A0; --warn:#EBB05A; --bad:#F28585;
  --poly:#7FD4FF; --multi:#FFAB6B; --gut:#E9D6AC; --syn:#B9A5FF; --kev:#FF8A8A;
  --shadow:0 1px 1px rgb(0 0 0/.4),0 18px 36px -16px rgb(0 0 0/.85); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;scrollbar-gutter:stable}
html.noscroll{overflow:hidden}
body{margin:0;background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
h1,h2,h3,p,dl,dd,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)} .warn{color:var(--warn)}
.ic{width:1.3em;height:1.3em;flex:none;display:block}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.disp{font-stretch:62%;font-weight:800;text-transform:uppercase;letter-spacing:.02em;line-height:1}
.h3{font:700 15px/1.3 var(--f-ui);color:var(--ink);margin:28px 0 10px}
.note{font-size:13.5px;color:var(--ink-2);margin:10px 0 0;max-width:62ch}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:6px;max-width:62ch}

/* ── Kopfzeile ── */
.topbar{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top);background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{width:min(1240px,100%);margin:0 auto;height:var(--topbar-h);padding:0 24px;display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink)}
.mark{width:28px;height:28px}
.wordmark{font-stretch:62%;font-weight:850;font-size:23px;letter-spacing:.07em;text-transform:uppercase;line-height:1}
.tabs{display:flex;gap:4px;margin-right:auto}
.tab{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font:600 14px/1 var(--f-ui);transition:background .18s var(--ease),color .18s}
.tab .ic{width:19px;height:19px}
.tab[aria-current="page"]{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-strong)}
.top-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.tabs + .top-actions{margin-left:0}
.sync{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-1);color:var(--ink-2);font:600 13px/1 var(--f-ui);white-space:nowrap}
.sync.ok .ic{color:var(--good)} .sync.warn .ic{color:var(--warn)} .sync.err{border-color:color-mix(in srgb,var(--bad) 60%,transparent)} .sync.err .ic{color:var(--bad)}
.sync.busy .ic{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Knöpfe ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface-1);color:var(--ink);font:600 14px/1 var(--f-ui);white-space:nowrap;transition:background .18s var(--ease),border-color .18s,transform .12s var(--ease),box-shadow .18s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent;font-weight:700;box-shadow:0 10px 22px -12px color-mix(in srgb,var(--accent) 70%,#000)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:transparent}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}
.btn.icon{width:40px;padding:0}
.btn.on{border-color:var(--ink-3);background:var(--surface-2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;color:var(--accent-text);font:600 13.5px/1.3 var(--f-ui);text-decoration:underline;text-underline-offset:3px}
.linkbtn .ic{width:16px;height:16px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
  .btn.primary:hover{background:var(--accent);filter:brightness(1.06);border-color:transparent}
  .btn.ghost:hover{background:var(--surface-2);border-color:transparent;color:var(--ink)}
  .tab:hover{color:var(--ink);background:var(--surface-2)}
  .sync:hover{border-color:var(--ink-3)}
  .row:hover{background:var(--surface-1)}
  .linkbtn:hover{color:var(--ink)}
}

/* ── Seite ── */
.page{width:min(1240px,100%);margin:0 auto;padding:26px 24px 80px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}
.vhead h1{font-size:38px}
.vact{display:flex;gap:10px;align-items:center}
.split{display:grid;grid-template-columns:minmax(340px,410px) minmax(0,1fr);gap:36px;align-items:start}
.side{position:sticky;top:calc(var(--topbar-h) + 14px);max-height:calc(100dvh - var(--topbar-h) - 28px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;border-radius:22px}
.mainc{min-width:0}
.none,.empty{padding:40px 8px;color:var(--ink-2)}
.none h3{font:700 18px/1.3 var(--f-ui);color:var(--ink);margin-bottom:6px}
.none .btn{margin-top:16px}

/* ── Listen ── */
.list,.ledger{display:block}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:13px 10px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;border-radius:0;transition:background .15s}
.row:active{background:var(--surface-2)}
.row[aria-current="true"]{background:var(--surface-2);border-radius:14px;border-color:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.row-main{display:grid;gap:2px;min-width:0}
.row-name{display:flex;align-items:center;gap:8px;font:650 16.5px/1.25 var(--f-ui)}
.row-sub{font-size:14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.row-strings{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center;font-size:13.5px;color:var(--ink-2);margin-top:2px}
.row-side{display:grid;justify-items:end;gap:3px;text-align:right}
.row-date{font:600 14px/1.2 var(--f-ui)}
.row-ago{font-size:13px;color:var(--ink-3)}
.tag{position:relative;display:grid;justify-items:center;align-content:end;gap:1px;width:60px;min-height:60px;padding:17px 4px 6px;border-radius:11px;background:var(--lcd-bg);border:1px solid var(--lcd-frame);color:#E7EEF1}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;border:1.5px solid #34434B}
.tag b{font-stretch:72%;font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.tag b.q{font-size:15.5px;color:#9FB0B8;border-top:1px solid #1F2B32;padding-top:2px;margin-top:1px}
.tag i{font-style:normal;font-size:10.5px;font-weight:600;color:#7F8F88;line-height:1;margin-top:3px}
.tag.two{min-height:72px}
.row[aria-current="true"] .tag b:first-child{color:var(--lcd-on)}
.chip{display:inline-flex;align-items:center;gap:6px;height:23px;padding:0 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);font:600 12px/1 var(--f-ui);white-space:nowrap}
.chip.own{color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 38%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.ok{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.chip.t-poly{color:var(--poly)} .chip.t-multi{color:var(--multi)} .chip.t-gut{color:var(--gut)} .chip.t-syn{color:var(--syn)} .chip.t-kev{color:var(--kev)}
.sline{display:inline-flex;align-items:center;gap:7px;min-width:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgb(128 140 148/.55);flex:none}
.sl-sep{color:var(--ink-3)}
.month{position:sticky;top:calc(var(--topbar-h) + env(safe-area-inset-top));z-index:5;display:flex;justify-content:space-between;align-items:baseline;padding:16px 10px 8px;background:color-mix(in srgb,var(--ground) 94%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:700 13.5px/1 var(--f-ui);color:var(--ink-2);border-bottom:1px solid var(--line)}
.month .num{color:var(--ink-3);font-weight:600}
.summary{display:flex;flex-wrap:wrap;gap:4px 0;margin:20px 0 2px;font-size:14px;color:var(--ink-2)}
.summary span+span::before{content:"";display:inline-block;width:1px;height:13px;background:var(--line-strong);margin:0 14px;vertical-align:-2px}
.summary b{color:var(--ink)}
.rk-thumb{display:grid;place-items:center;width:60px;height:60px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3)}
.minibed{height:48px;width:auto}
.coil{width:26px;height:56px;border-radius:9px;background:var(--c);box-shadow:inset 0 0 0 1px rgb(128 140 148/.5),inset -5px 0 7px -3px rgb(0 0 0/.4),inset 4px 0 6px -3px rgb(255 255 255/.18);margin:0 17px 0 17px}
.tape{display:grid;grid-template-columns:minmax(90px,1fr) auto auto;gap:10px;align-items:center;margin-top:8px;max-width:420px}
.tape .rail{position:relative;height:14px;border-radius:4px;background:var(--surface-3);border:1px solid var(--line-strong);overflow:hidden}
.tape .rail i{position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--viz)}
.tape .rail::after{content:"";position:absolute;inset:auto 0 0 0;height:6px;background:repeating-linear-gradient(90deg,rgb(0 0 0/.5) 0 1px,transparent 1px calc(100%/var(--n)))}
.tape.low .rail i{background:var(--warn)} .tape.crit .rail i{background:var(--bad)}
.tape b{font:700 15px/1 var(--f-ui)} .tape em{font-style:normal;font-size:12.5px;color:var(--ink-3)}

/* ── Suche und Filter ── */
.toolbar{display:flex;gap:10px;margin-top:22px}
.search{position:relative;flex:1;min-width:0}
.search .ic{position:absolute;left:15px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--ink-3);pointer-events:none}
.search input{padding-left:44px;border-radius:999px;-webkit-appearance:none;appearance:none}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:700 11.5px/1 var(--f-ui)}
.fpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px;padding:16px;border-radius:16px;background:var(--surface-1);border:1px solid var(--line)}
.fclear{grid-column:1/-1}
.due{margin-top:4px;margin-bottom:6px;padding:4px 16px 8px;border-radius:16px;background:var(--surface-1);border:1px solid var(--line)}
.due .h3{margin:14px 0 4px}
.due li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.due li:last-child{border-bottom:0}
.due li div{display:grid;min-width:0} .due li b{font-weight:650} .due li span{font-size:13.5px;color:var(--ink-2)}

/* ── Felder ── */
.form{display:grid;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{min-width:0;border:0;padding:0;margin:0}
.field label,.field legend,.flabel{display:block;font:600 13.5px/1.2 var(--f-ui);color:var(--ink-2);margin-bottom:7px;padding:0}
input,select,textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface-1);color:var(--ink);font:400 16px/1.3 var(--f-ui)}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
input:focus,select:focus,textarea:focus{border-color:var(--ink-3)}
.search input,.fpanel input,.fpanel select{background:var(--surface-1)}
.sel{position:relative}
.sel select{-webkit-appearance:none;appearance:none;padding-right:40px;cursor:pointer}
.sel::after{content:"";position:absolute;right:14px;top:50%;width:14px;height:14px;margin-top:-7px;background:var(--ink-3);-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><path d='M213.7 101.7l-80 80a8 8 0 0 1-11.4 0l-80-80a8 8 0 0 1 11.4-11.4L128 164.7l74.3-74.4a8 8 0 0 1 11.4 11.4z'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'><path d='M213.7 101.7l-80 80a8 8 0 0 1-11.4 0l-80-80a8 8 0 0 1 11.4-11.4L128 164.7l74.3-74.4a8 8 0 0 1 11.4 11.4z'/></svg>") center/contain no-repeat;pointer-events:none}
.check{display:flex;align-items:center;gap:10px;min-height:46px;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{min-height:38px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 14px/1 var(--f-ui);transition:background .18s var(--ease),color .18s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.field .seg{display:flex;width:100%} .field .seg button{flex:1}
.sp-group{display:grid;gap:8px;margin-bottom:12px}
.sp-title{font-size:12.5px;color:var(--ink-3);font-weight:600}
.sp-opt{display:block;position:relative;margin:0!important}
.sp-opt input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.sp-in{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;min-height:50px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface-1);cursor:pointer;transition:border-color .15s,background .15s}
.sp-in .sw{width:14px;height:14px}
.sp-name{font-weight:600;font-size:15px;color:var(--ink)} .sp-meta{font-size:13px;color:var(--ink-3)}
.sp-opt input:checked + .sp-in{border-color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--ink)}
.sp-opt input:focus-visible + .sp-in{outline:2px solid var(--focus);outline-offset:2px}
.sp-cur{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface-1);text-align:left;color:var(--ink)}
.sp-cur .sw{width:14px;height:14px}
.sp-change{font-size:13px;font-weight:600;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-strong);background:var(--c);padding:0}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface-1),0 0 0 4px var(--ink)}
.swb.custom{display:grid;place-items:center;position:relative;overflow:hidden;background:conic-gradient(#e74c3c,#f1c40f,#2ecc71,#1abc9c,#3498db,#9b59b6,#e74c3c)}
.swb.custom input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;padding:0;border:0;cursor:pointer}

/* ── Spannungsregler ── */
.tens-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tens-head .flabel{margin:0}
.tens-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tc{display:grid;gap:10px;padding:14px;border-radius:16px;background:var(--surface-1);border:1px solid var(--line)}
.tc-head{display:flex;justify-content:space-between;align-items:baseline}
.tc-head label{margin:0;font-weight:700;color:var(--ink)} .tc-lbs{font-size:13px;color:var(--ink-3)}
.tc-lcd{position:relative;display:flex;justify-content:center;align-items:center;min-height:92px;padding:14px;border-radius:12px;background:var(--lcd-bg);border:1px solid var(--lcd-frame)}
.tc-lcd:focus-within{outline:2px solid var(--focus);outline-offset:2px}
.tc-lcd .lcdslot{display:block}
.tc-in{position:absolute;inset:0;width:100%;height:100%;min-height:0;padding:0;opacity:0;text-align:center;border:0;background:transparent;cursor:text}
.tc-row{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.btn.icon.step{width:44px;height:44px;min-height:0;padding:0}
.rulerwrap{position:relative;padding-bottom:20px}
.ruler{-webkit-appearance:none;appearance:none;display:block;width:100%;height:42px;min-height:0;padding:0;margin:0;border:0;background:transparent;cursor:pointer;touch-action:pan-y}
.ruler::-webkit-slider-runnable-track{height:42px;border-radius:9px;border:1px solid var(--line-strong);background:
  linear-gradient(90deg,transparent 0 calc(10% - .75px),var(--ink-2) calc(10% - .75px) calc(10% + .75px),transparent calc(10% + .75px)) left bottom/20% 22px repeat-x,
  repeating-linear-gradient(90deg,var(--ink-3) 0 1px,transparent 1px 5%) left bottom/100% 11px no-repeat,var(--surface-2)}
.ruler::-moz-range-track{height:42px;border-radius:9px;border:1px solid var(--line-strong);background:
  linear-gradient(90deg,transparent 0 calc(10% - .75px),var(--ink-2) calc(10% - .75px) calc(10% + .75px),transparent calc(10% + .75px)) left bottom/20% 22px repeat-x,
  repeating-linear-gradient(90deg,var(--ink-3) 0 1px,transparent 1px 5%) left bottom/100% 11px no-repeat,var(--surface-2)}
.ruler::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:54px;margin-top:-7px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 2px var(--surface-1),0 6px 12px rgb(0 0 0/.35)}
.ruler::-moz-range-thumb{width:6px;height:54px;border:0;border-radius:3px;background:var(--accent);box-shadow:0 0 0 2px var(--surface-1)}
.rscale span{position:absolute;bottom:0;left:var(--x);transform:translateX(-50%);font-size:11.5px;color:var(--ink-3)}

/* ── LCD und Konsole (das Gerät bleibt in beiden Themen dunkel) ── */
.lcd-svg{display:block;height:54px;width:auto;overflow:visible}
.lcd-svg .on{fill:var(--lcd-on)} .lcd-svg .off{fill:var(--lcd-off)}
.console{--c-ink:#E7EEF1;--c-dim:#8A9AA4;position:relative;padding:34px 20px 20px;border-radius:22px;border:1px solid #1D2830;background:linear-gradient(180deg,#0F171C 0%,#0A1014 100%);color:var(--c-ink);box-shadow:var(--shadow)}
.console::before{content:"";position:absolute;top:12px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;border:2px solid #2E3C45}
.con-head{margin-bottom:16px}
.con-name{font-stretch:75%;font-weight:800;font-size:31px;line-height:1.05;letter-spacing:.005em;text-wrap:balance}
.con-sub{margin-top:5px;font-size:14px;color:var(--c-dim)}
.lcdbox{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:flex-end;padding:14px 16px 12px;border-radius:14px;background:var(--lcd-bg);border:1px solid var(--lcd-frame);box-shadow:inset 0 2px 12px rgb(0 0 0/.65)}
.lcd-cell{display:grid;grid-template-columns:auto auto;grid-template-areas:"l l" "d u";column-gap:8px;align-items:end}
.lcd-lbl{grid-area:l;font-size:12.5px;font-weight:600;color:var(--lcd-dim);margin-bottom:5px}
.lcd-cell .lcd-svg{grid-area:d}
.lcd-unit{grid-area:u;font-size:13px;font-weight:600;color:var(--lcd-dim);padding-bottom:2px}
.lcd-lbs{flex-basis:100%;font-size:12.5px;color:var(--lcd-dim)}
.stage{position:relative;margin-top:16px;padding:12px 12px 10px;border-radius:16px;border:1px solid #1B252C;background:radial-gradient(120% 90% at 50% 18%,#142029 0%,#0A1115 72%)}
.bed{display:block;width:100%;max-width:264px;margin:0 auto;touch-action:pan-y;cursor:pointer}
.stage-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.stage-hint{font-size:12px;color:var(--c-dim,#8A9AA4);text-align:right}
.tonbtn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid #2A3841;background:transparent;color:#C5D1D7;font:600 13px/1 var(--f-ui);white-space:nowrap}
.tonbtn .ic{width:18px;height:18px}
.tonbtn[aria-pressed="true"]{color:var(--lcd-on);border-color:color-mix(in srgb,var(--lcd-on) 45%,transparent)}
.con-dl{display:grid;gap:0;margin-top:14px}
.con-dl > div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid #1B262D}
.con-dl dt{font-size:13px;color:var(--c-dim)} .con-dl dd{font-size:14.5px;color:var(--c-ink)}
.meters,.gauge{margin-left:8px;font-size:13px;color:var(--c-dim)}
.con-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.console .btn:not(.primary){background:#141E25;border-color:#2A3841;color:#E7EEF1}
.console .btn.ghost{background:transparent;border-color:transparent;color:#B7C5CC}
.console .chip{background:#141E25;border-color:#26333B;color:#B9C6CD}
.console .chip.warn{color:#EBB05A;border-color:rgb(235 176 90/.45)} .console .chip.ok{color:#74D6A0;border-color:rgb(116 214 160/.45)}
.console .sw{box-shadow:inset 0 0 0 1px rgb(255 255 255/.3)}
@media (hover:hover) and (pointer:fine){.console .btn:not(.primary):hover{background:#1A2730;border-color:#3A4B56}.tonbtn:hover{border-color:#4A5C68}}
.hero{display:grid;gap:12px;padding:16px;border-radius:20px;border:1px solid #1D2830;background:linear-gradient(180deg,#0F171C,#0A1014);color:#E7EEF1;box-shadow:var(--shadow)}
.hero-open{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l c" "t c";gap:12px 10px;align-items:center;width:100%;padding:0;border:0;background:none;text-align:left;color:inherit}
.hero-open .lcdbox{grid-area:l;padding:11px 13px 9px} .hero-open .lcd-lbs{display:none}
.hero-open > .ic{grid-area:c;color:#7F8F98;width:22px;height:22px}
.hero-txt{grid-area:t;display:grid;gap:1px} .hero-txt b{font-stretch:78%;font-weight:800;font-size:22px;line-height:1.1} .hero-txt span{font-size:13.5px;color:#8A9AA4}
.hero-again{width:100%}
.empty{max-width:540px;margin:6vh auto 0;text-align:left}
.empty-lcd{display:inline-block;padding:18px 22px 16px;border-radius:16px;background:var(--lcd-bg);border:1px solid var(--lcd-frame);margin-bottom:26px}
.empty h1{font-size:46px;margin-bottom:14px;color:var(--ink)}
.empty p{max-width:52ch;margin-bottom:12px}
.empty-setup{color:var(--ink)}
.empty-act{margin:26px 0 20px}
.empty-demo{font-size:13.5px;color:var(--ink-3)}
.story{font-size:19px;line-height:1.5;max-width:60ch;color:var(--ink-2);margin:6px 0 30px;text-wrap:pretty}
.story b{color:var(--ink);font-weight:700}
.story.sm{font-size:16px;margin:0 0 20px}
.facts{display:grid}
.facts > div{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.facts dt{font-size:13.5px;color:var(--ink-3)} .facts dd{font-size:15px}
.rollbox{padding:0 0 14px}
.stage + .facts{margin-top:18px}

/* ── Statistik ── */
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 44px}
.chart.wide{grid-column:1/-1}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;height:178px}
.bar,.hb{display:flex;flex-direction:column;justify-content:flex-end;gap:5px;min-width:0;text-align:center}
.bar b,.hb b{height:16px;font-size:12px;font-weight:600;color:var(--ink-2)}
.bar .col,.hb .col{display:flex;align-items:flex-end;height:112px}
.bar i,.hb i{display:block;width:100%;height:var(--h);min-height:3px;border-radius:5px 5px 2px 2px;background:var(--line-strong)}
.bar[style*="--h:0%"] i,.hb[style*="--h:0%"] i{background:var(--line)}
.bar:not([style*="--h:0%"]) i,.hb:not([style*="--h:0%"]) i{background:var(--viz)}
.bar.now i{box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px var(--viz)}
.bar span,.hb span{height:20px;font-size:12px;color:var(--ink-3)}
.hist{position:relative;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:6px;height:178px}
.mean{position:absolute;left:var(--x);top:18px;bottom:26px;width:0;border-left:2px dashed var(--ink)}
.mean span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;background:var(--ground);padding:0 4px}
.rank{display:grid;gap:14px}
.rank li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
.rk-name{display:flex;align-items:center;gap:9px;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank b{font-size:14px}
.rk-bar{grid-column:1/-1;height:7px}

    /* Gleiche Standard-Kennungen auf jedem Gerät, sonst entstünden beim Abgleich
       zwei „Ich“ und zwei Blade. Bestehende Einträge werden umbenannt, nicht neu angelegt. */
    const taken = id => COLLS.some(c=>st[c].some(e=>e.id===id));
    const owner = st.settings.ownerId;
    if(owner && owner!==ID.me && !taken(ID.me)) renameId(st, owner, ID.me);
    const blade = st.rackets.find(r=>r.ownerId===ID.me && r.brand==="Wilson" && /^Blade v9/i.test(r.model));
    if(blade && blade.id!==ID.blade && !taken(ID.blade)) renameId(st, blade.id, ID.blade);
    const hg = st.strings.find(s=>s.brand==="Solinco"&&s.model==="Hyper-G"&&s.own!==false);
    if(hg && hg.id!==ID.hyperG && !taken(ID.hyperG)) renameId(st, hg.id, ID.hyperG);
    const pl = st.strings.find(s=>s.brand==="Kirschbaum"&&s.model==="Pro Line II"&&s.own!==false);
    if(pl && pl.id!==ID.proLine && !taken(ID.proLine)) renameId(st, pl.id, ID.proLine);
    for(const c of COLLS) for(const e of st[c]) if(!e.updatedAt) e.updatedAt = 1;   // „uralt“: Neueres gewinnt beim Abgleich
    st.v = 4;
  }
  if(!st.tomb) st.tomb = {};
  return st;
}

/* ── Speicher ──────────────────────────────────────────────────────────
   Browser-Speicher ist Zwischenablage, nicht Archiv: er kann verschwinden. Das
   eigentliche Archiv liegt in der Datei und im GitHub-Repo. Ein Lesefehler darf
   nie stillschweigend zu einem leeren Archiv führen. */
let storageOK = true, loadProblem = null, bannerZu = false;

function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ storageOK = false; loadProblem = "Dieser Browser lässt keinen Speicher zu."; return seed(); }
  if(raw == null) return seed();
  try{
    const p = JSON.parse(raw);
    if(!p || !Array.isArray(p.players) || !Array.isArray(p.jobs)) throw new Error("unerwarteter Aufbau");
    const st = ensureMeta(migrate(p));
    if(!st.meta.hashes) baseline(st);
    return st;
  }catch(e){
    try{ localStorage.setItem(KEY+".beschaedigt", raw); }catch(_){}
    loadProblem = "Der gespeicherte Stand war nicht lesbar ("+e.message+"). Er liegt unter „saitenbuch.v1.beschaedigt“, nichts wurde überschrieben.";
    return seed();
  }
}
function persist(){
  try{
    const prev = localStorage.getItem(KEY);
    if(prev) localStorage.setItem(BAK, prev);
    localStorage.setItem(KEY, JSON.stringify(S));
    storageOK = true;
  }catch(e){
    storageOK = false;
    toast("Browser-Speicher nicht verfügbar. Bitte als Datei sichern.");
  }
}
/* Zeitstempel für jede tatsächlich geänderte Einheit; Entferntes wird zum Grabstein.
   Ohne beides könnte ein Abgleich Gelöschtes aus der Cloud wieder hereinholen. */
function stamp(st){
  ensureMeta(st);
  const now = Date.now(), H = st.meta.hashes || (st.meta.hashes = {}), seen = {};
  for(const c of COLLS) for(const e of st[c]){
    seen[e.id] = 1;
    const h = hashOf(e);
    if(!(e.id in H)){ if(!e.updatedAt) e.updatedAt = now; H[e.id] = h; }
    else if(H[e.id] !== h){ e.updatedAt = now; H[e.id] = h; }
  }
  for(const id of Object.keys(H)) if(!seen[id]){ st.tomb[id] = now; delete H[id]; }
  const cut = now - TOMB_DAYS*864e5;
  for(const id of Object.keys(st.tomb)) if(st.tomb[id] < cut) delete st.tomb[id];
}
function save(){
  ensureMeta(S); stamp(S);
  S.meta.changes++;
  persist();
  queueSync();
  if(!ghAktiv() && (S.meta.changes===4 || S.meta.changes===12 || S.meta.changes%25===0))
    setTimeout(()=>toast("Denk an eine Sicherung: Daten und Abgleich oben rechts."), 900);
}
/* Ganzen Stand ersetzen (Import, Wiederherstellen, Leeren): Entferntes wird mit Grabstein
   markiert und alles Übernommene gilt als neueste Absicht, sonst käme es per Abgleich zurück. */
function replaceState(next){
  const now = Date.now(), before = new Set();
  if(S) for(const c of COLLS) for(const e of S[c]) before.add(e.id);
  next = ensureMeta(migrate(next));
  const after = new Set();
  for(const c of COLLS) for(const e of next[c]){ after.add(e.id); e.updatedAt = now; }
  next.tomb = Object.assign({}, S? S.tomb : {}, next.tomb||{});
  for(const id of before) if(!after.has(id)) next.tomb[id] = now;
  for(const id of after) delete next.tomb[id];
  next.meta = Object.assign({}, S? S.meta : {}, next.meta||{}, {changes:0});
  baseline(next);
  S = next;
}

/* Zusammenführen: pro Eintrag gewinnt der neuere Zeitstempel, Grabsteine gewinnen gegen Älteres. */
function contentKey(st){
  const by = a => [...a].sort((x,y)=> x.id<y.id?-1:1);
  return JSON.stringify({s:st.settings, p:by(st.players), r:by(st.rackets), t:by(st.strings), j:by(st.jobs), x:st.tomb});
}
function mergeStates(L, R){
  R = migrate(clone(R));
  const tomb = Object.assign({}, R.tomb||{});
  for(const id of Object.keys(L.tomb||{})) tomb[id] = Math.max(tomb[id]||0, L.tomb[id]);
  const out = {v:4, settings:Object.assign({}, R.settings||{}, L.settings||{}), tomb, meta:L.meta};
  for(const c of COLLS){
    const m = new Map();
    for(const e of (R[c]||[])) m.set(e.id, e);
    for(const e of (L[c]||[])){ const r = m.get(e.id); if(!r || (e.updatedAt||0) >= (r.updatedAt||0)) m.set(e.id, e); }
    out[c] = [...m.values()].filter(e => !(tomb[e.id] && tomb[e.id] >= (e.updatedAt||0)));
  }
  return out;
}
/* Was in Datei und Cloud liegt: ohne lokale Gerätedaten (Token, Hashes, Zähler). */
function exportState(){
  return {app:"saitenbuch", v:4, savedAt:new Date().toISOString(), settings:S.settings,
    players:S.players, rackets:S.rackets, strings:S.strings, jobs:S.jobs, tomb:S.tomb};
}

/* ══════════ Abfragen ══════════ */
const player = id => S.players.find(p=>p.id===id);
const racket = id => S.rackets.find(r=>r.id===id);
const strg   = id => S.strings.find(s=>s.id===id);
const jobById = id => S.jobs.find(j=>j.id===id);
const pName  = id => (player(id)||{}).name || "Unbekannt";
const rName  = id => { const r=racket(id); return r? r.brand+" "+r.model : "Unbekannter Schläger"; };
const sName  = id => { const s=strg(id); return s? s.brand+" "+s.model : "-"; };
const sFull  = id => { const s=strg(id); return s? s.brand+" "+s.model+" "+gmm(s.gauge) : "-"; };
const isMe   = id => id===S.settings.ownerId;
const jobsSorted = () => [...S.jobs].sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||"").localeCompare(a.createdAt||""));
const jobsOf = pid => jobsSorted().filter(j=>j.playerId===pid);
const jobsOfRacket = rid => jobsSorted().filter(j=>j.racketId===rid);
const jobsWithString = sid => jobsSorted().filter(j=>j.mainId===sid||j.crossId===sid);
/* Zwei Saiten = Hybrid. Zwei Härten = geteilt (z. B. 24/23), auch mit nur einer Saite. */
const isHybrid = j => !!(j.crossId && j.crossId!==j.mainId);
const isSplit  = j => Number(j.tMain)!==Number(j.tCross);
const tensions = j => isSplit(j)? [+j.tMain,+j.tCross] : [+j.tMain];
function stringTensions(s){
  const out=[];
  jobsWithString(s.id).forEach(j=>{
    if(j.mainId===s.id) out.push(+j.tMain);
    if(isHybrid(j)? j.crossId===s.id : (j.mainId===s.id && isSplit(j))) out.push(+j.tCross);
  });
  return out.filter(n=>!isNaN(n));
}
function stringRemaining(s){
  if(!s.roll) return null;
  const used = S.jobs.filter(j=> !s.rollOpened || j.date >= s.rollOpened)
    .reduce((sum,j)=> sum + (j.mainId===s.id?(+j.mainM||0):0) + (j.crossId===s.id?(+j.crossM||0):0), 0);
  return Math.max(0, s.roll - used);
}
/* Rhythmus eines Schlägers: durchschnittlicher Abstand zwischen zwei Bespannungen. */
function racketInterval(rid){
  const js = jobsOfRacket(rid), iv=[];
  for(let i=0;i<js.length-1;i++) iv.push(daysBetween(js[i+1].date, js[i].date));
  return iv.length? Math.max(7, Math.round(avg(iv))) : null;
}
/* „Bald wieder dran“: Schläger, deren letzte Bespannung länger her ist als ihr üblicher Rhythmus. */
function dueRackets(limit){
  const out=[];
  S.rackets.forEach(r=>{
    const js = jobsOfRacket(r.id); if(!js.length || r.retired) return;
    const days = daysBetween(js[0].date, todayISO());
    const rhythm = racketInterval(r.id), basis = rhythm || 60;
    if(days >= basis) out.push({r, last:js[0], days, basis, known:!!rhythm, ratio:days/basis});
  });
  return out.sort((a,b)=>b.ratio-a.ratio).slice(0, limit||3);
}

/* ══════════ Anzeige: Siebensegment ══════════
   Prozedural gezeichnet: scharf in jeder Größe, Farben über Variablen,
   unbeleuchtete Segmente bleiben als Schatten stehen wie bei echten Displays. */
const SEG_ON = {"0":"abcdef","1":"bc","2":"abdeg","3":"abcdg","4":"bcfg","5":"acdfg","6":"acdefg","7":"abc","8":"abcdefg","9":"abcdfg","-":"g"," ":""};
const CELL = {w:24,h:44,t:5.2,g:2.2};
function digitPolys(x0, on){
  const w=CELL.w,t=CELL.t,g=CELL.g,h=CELL.h,hh=t/2,L=hh,R=w-hh,T=hh,B=h-hh,M=h/2;
  const H=(y,a,b)=>[[a,y],[a+hh,y-hh],[b-hh,y-hh],[b,y],[b-hh,y+hh],[a+hh,y+hh]];
  const V=(x,a,b)=>[[x,a],[x+hh,a+hh],[x+hh,b-hh],[x,b],[x-hh,b-hh],[x-hh,a+hh]];
  const segs={a:H(T,L+g,R-g), b:V(R,T+g,M-g), c:V(R,M+g,B-g), d:H(B,L+g,R-g), e:V(L,M+g,B-g), f:V(L,T+g,M-g), g:H(M,L+g,R-g)};
  let out="";
  for(const k of "abcdefg"){
    const pts = segs[k].map(p=>(p[0]+x0).toFixed(2)+","+p[1].toFixed(2)).join(" ");
    out += '<polygon class="'+(on.indexOf(k)>=0?"on":"off")+'" points="'+pts+'"/>';
  }
  return out;
}
function lcd(str, o){
  o = o||{};
  const txt = String(str), w=CELL.w, h=CELL.h, gap=5;
  let x=0, cells="";
  for(let i=0;i<txt.length;i++){
    const ch = txt[i];
    if(ch==="." || ch===",") continue;
    cells += digitPolys(x, o.ghost? "" : (SEG_ON[ch]||""));
    x += w;
    if(txt[i+1]==="." || txt[i+1]===","){ cells += '<circle class="'+(o.ghost?"off":"on")+'" cx="'+(x+4.2)+'" cy="'+(h-2.7)+'" r="2.8"/>'; x += 9.5; }
    else x += gap;
  }
  x -= gap;
  const label = o.label || (txt.replace(".",",")+" Kilogramm");
  return '<svg class="lcd-svg'+(o.cls?" "+o.cls:"")+'" viewBox="0 0 '+(x+6)+' '+h+'" role="img" aria-label="'+esc(label)+'"'+(o.h?' style="height:'+o.h+'px"':'')+'><g transform="translate(5.6 0) skewX(-6)">'+cells+'</g></svg>';
}

/* ══════════ Ton ══════════
   Bespanner prüfen Saiten nach Gehör: höhere Spannung, höherer Ton. Das hier ist eine
   Näherung (Tonhöhe proportional zur Härte), keine Messung. */
let AC = null, sndOn = false;
try{ sndOn = localStorage.getItem("saitenbuch_ton")==="1"; }catch(e){}
function audio(){
  if(!AC){ const C = window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ AC = new C(); }catch(e){ return null; } }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
const toneFor = kg => Math.min(300, Math.max(120, 196*(Number(kg)||24)/24));
function pluckTone(freq, vel){
  const c = audio(); if(!c) return;
  const t = c.currentTime, sr = c.sampleRate, n = Math.max(32, Math.round(sr*0.012));
  const buf = c.createBuffer(1,n,sr), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1)*(1-i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const del = c.createDelay(0.05); del.delayTime.value = 1/freq;
  const fb = c.createGain(); fb.gain.value = 0.992;
  const lp = c.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2600;
  const out = c.createGain();
  out.gain.setValueAtTime(0.0001,t);
  out.gain.exponentialRampToValueAtTime(Math.max(0.02,0.34*vel), t+0.004);
  out.gain.exponentialRampToValueAtTime(0.0001, t+1.5);
  src.connect(del); del.connect(lp); lp.connect(fb); fb.connect(del); del.connect(out); out.connect(c.destination);
  src.start(t); src.stop(t+0.02);
  setTimeout(()=>{ try{ out.disconnect(); del.disconnect(); }catch(e){} }, 1800);
}
function setSound(on){
  sndOn = !!on;
  try{ localStorage.setItem("saitenbuch_ton", sndOn?"1":"0"); }catch(e){}
  paintSound();
  if(sndOn){ pluckTone(toneFor(24), .8); }
}
function paintSound(){
  document.querySelectorAll(".tonbtn").forEach(b=>{
    b.setAttribute("aria-pressed", String(sndOn));
    b.innerHTML = ic(sndOn?"speaker-high":"speaker-slash")+"<span>"+(sndOn?"Ton an":"Ton aus")+"</span>";
  });
}

/* ══════════ Saitenbett (Canvas) ══════════
   Echte Saitenzahl des Schlägers, Saitenfarben aus dem Regal. Antippen oder darüber
   wischen lässt die Saiten schwingen; das Bett gehört zum Gerät und bleibt deshalb in
   beiden Themen auf dunkler Bühne. */
const BED_ASPECT = 1.4;
const beds = new Set();
/* Sehr dunkle Saiten (Schwarz) wären auf der dunklen Bühne unsichtbar: für das Bild aufhellen. */
function viz(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex||""); if(!m) return hex||"#8FA0AA";
  const n = parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  if((0.2126*r+0.7152*g+0.0722*b)/255 > 0.22) return hex;
  const k = c => Math.round(c*0.42 + 165*0.58);
  return "#"+[k(r),k(g),k(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function bedCfgFromJob(j){
  const r = racket(j.racketId)||{}, sm = strg(j.mainId)||{}, sc = j.crossId? (strg(j.crossId)||{}) : sm;
  return {mains:r.mains||16, crosses:r.crosses||19, cm:viz(sm.color||"#8FA0AA"), cc:viz(sc.color||sm.color||"#8FA0AA"),
          tm:+j.tMain||24, tc:+j.tCross||+j.tMain||24};
}
function bedCfgFromRacket(rid){
  const r = racket(rid)||{}, j = jobsOfRacket(rid)[0];
  if(j) return bedCfgFromJob(j);
  return {mains:r.mains||16, crosses:r.crosses||19, cm:"#5B6B75", cc:"#5B6B75", tm:24, tc:24};
}
function bedGeo(W){
  const rx = W*0.42, ry = rx*1.26, cy = W*0.03+ry, cx = W/2;
  const fw = Math.max(5, W*0.026), rxi = rx-fw/2-1, ryi = ry-fw/2-1;
  return {W, H:W*BED_ASPECT, cx, cy, rx, ry, fw, rxi, ryi};
}
function bedStrings(g, cfg){
  const m=[], c=[];
  const dx = cfg.mains>1 ? (2*g.rxi*0.80)/(cfg.mains-1) : 0, dy = cfg.crosses>1 ? (2*g.ryi*0.84)/(cfg.crosses-1) : 0;
  for(let i=0;i<cfg.mains;i++){
    const x = g.cx + (i-(cfg.mains-1)/2)*dx, k = Math.sqrt(Math.max(0,1-Math.pow((x-g.cx)/g.rxi,2)));
    m.push({p:x, a:g.cy-g.ryi*k, b:g.cy+g.ryi*k});
  }
  for(let i=0;i<cfg.crosses;i++){
    const y = g.cy + (i-(cfg.crosses-1)/2)*dy, k = Math.sqrt(Math.max(0,1-Math.pow((y-g.cy)/g.ryi,2)));
    c.push({p:y, a:g.cx-g.rxi*k, b:g.cx+g.rxi*k});
  }
  return {m,c};
}
function vib(s, now){
  if(!s || !s.a) return 0;
  const t = now - s.t0, e = Math.exp(-t/s.tau);
  if(e < 0.012){ s.a = 0; return 0; }
  return s.a*e*Math.cos(2*Math.PI*s.f*t);
}
function drawBed(b, now){
  const cv=b.cv, ctx=b.ctx, g=b.geo, cfg=b.cfg; if(!g) return;
  ctx.setTransform(b.dpr,0,0,b.dpr,0,0);
  ctx.clearRect(0,0,g.W,g.H);
  /* Hals und Griff */
  ctx.lineCap = "round";
  const yb = g.cy+g.ry, hw = g.W*0.05, throat = ctx.createLinearGradient(0,yb-6,0,g.H);
  throat.addColorStop(0,"#C9D3D8"); throat.addColorStop(1,"#8E9CA4");
  ctx.strokeStyle = throat; ctx.lineWidth = Math.max(5,g.W*0.024);
  ctx.beginPath();
  ctx.moveTo(g.cx-g.rx*0.34, yb-g.ry*0.08); ctx.lineTo(g.cx-hw, g.H*0.885);
  ctx.moveTo(g.cx+g.rx*0.34, yb-g.ry*0.08); ctx.lineTo(g.cx+hw, g.H*0.885);
  ctx.stroke();
  const gr = ctx.createLinearGradient(g.cx-hw,0,g.cx+hw,0);
  gr.addColorStop(0,"#2A353C"); gr.addColorStop(.5,"#46545D"); gr.addColorStop(1,"#222D33");
  ctx.fillStyle = gr;
  const gx = g.cx-hw*1.05, gy = g.H*0.86, gw = hw*2.1, gh = g.H*0.2, rr = gw*0.35;
  ctx.beginPath(); ctx.moveTo(gx+rr,gy); ctx.arcTo(gx+gw,gy,gx+gw,gy+gh,rr); ctx.lineTo(gx+gw,gy+gh); ctx.lineTo(gx,gy+gh); ctx.arcTo(gx,gy,gx+gw,gy,rr); ctx.closePath(); ctx.fill();
  /* Saiten, auf das Innere des Rahmens begrenzt */
  ctx.save();
  ctx.beginPath(); ctx.ellipse(g.cx,g.cy,g.rxi,g.ryi,0,0,Math.PI*2); ctx.clip();
  const sw = Math.max(1.1, g.W*0.0055);
  ctx.lineWidth = sw; ctx.lineCap = "butt";
  ctx.strokeStyle = cfg.cc; ctx.globalAlpha = .96;
  b.str.c.forEach((s,i)=>{
    const d = vib(b.st.c[i], now);
    ctx.beginPath(); ctx.moveTo(s.a, s.p); ctx.quadraticCurveTo((s.a+s.b)/2, s.p+2*d, s.b, s.p); ctx.stroke();
  });
  ctx.strokeStyle = cfg.cm;
  b.str.m.forEach((s,i)=>{
    const d = vib(b.st.m[i], now);
    ctx.beginPath(); ctx.moveTo(s.p, s.a); ctx.quadraticCurveTo(s.p+2*d, (s.a+s.b)/2, s.p, s.b); ctx.stroke();
  });
  ctx.restore();
  /* Rahmen */
  const fr = ctx.createLinearGradient(0,0,0,g.cy+g.ry);
  fr.addColorStop(0,"#EEF3F5"); fr.addColorStop(1,"#A9B6BD");
  ctx.strokeStyle = fr; ctx.lineWidth = g.fw;
  ctx.beginPath(); ctx.ellipse(g.cx,g.cy,g.rx,g.ry,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle = "rgba(6,10,12,.38)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(g.cx,g.cy,g.rx-g.fw/2,g.ry-g.fw/2,0,0,Math.PI*2); ctx.stroke();
}
function anyVib(b, now){
  for(const s of b.st.m) if(s && s.a && now-s.t0 < s.tau*4.4) return true;
  for(const s of b.st.c) if(s && s.a && now-s.t0 < s.tau*4.4) return true;
  return false;
}
function tickBed(b){
  const now = performance.now()/1000;
  drawBed(b, now);
  b.raf = anyVib(b, now) ? requestAnimationFrame(()=>tickBed(b)) : 0;
  if(!b.raf) drawBed(b, now+99);
}
function kickBed(b){ if(!b.raf) b.raf = requestAnimationFrame(()=>tickBed(b)); }
function pluckString(b, kind, i, amp, dir, loud){
  const cfg = b.cfg, now = performance.now()/1000, kg = kind==="m"? cfg.tm : cfg.tc;
  const calm = b.calm;
  b.st[kind][i] = {a:(calm? Math.min(amp,1.6):amp)*dir, t0:now, f:7+(kg-20)*0.45, tau:calm?0.14:0.78};
  kickBed(b);
  if(loud && sndOn && now-b.sndAt > 0.045){ b.sndAt = now; pluckTone(toneFor(kg)*(1+(i%3)*0.0015), Math.min(1, 0.35+amp/10)); }
}
function strum(b, p0, p1, loud){
  const g=b.geo, sp = Math.hypot(p1.x-p0.x, p1.y-p0.y); if(!sp) return;
  const amp = Math.max(2.2, Math.min(9, sp*0.55));
  b.str.m.forEach((s,i)=>{
    if((p0.x-s.p)*(p1.x-s.p) < 0){
      const y = (p0.y+p1.y)/2; if(y>=s.a-2 && y<=s.b+2) pluckString(b,"m",i,amp,p1.x>p0.x?1:-1,loud);
    }
  });
  b.str.c.forEach((s,i)=>{
    if((p0.y-s.p)*(p1.y-s.p) < 0){
      const x = (p0.x+p1.x)/2; if(x>=s.a-2 && x<=s.b+2) pluckString(b,"c",i,amp,p1.y>p0.y?1:-1,loud);
    }
  });
}
function nearest(b, p){
  let best=null, bd=11;
  b.str.m.forEach((s,i)=>{ const d=Math.abs(p.x-s.p); if(d<bd && p.y>=s.a && p.y<=s.b){ bd=d; best={k:"m",i,dir:p.x>=s.p?-1:1}; } });
  b.str.c.forEach((s,i)=>{ const d=Math.abs(p.y-s.p); if(d<bd && p.x>=s.a && p.x<=s.b){ bd=d; best={k:"c",i,dir:p.y>=s.p?-1:1}; } });
  return best;
}
function makeBed(cv){
  const cfg = cv.dataset.job ? bedCfgFromJob(jobById(cv.dataset.job)||{}) : bedCfgFromRacket(cv.dataset.racket);
  const b = {cv, cfg, ctx:cv.getContext("2d"), W:0, dpr:1, geo:null, str:{m:[],c:[]}, st:{m:[],c:[]}, raf:0, sndAt:0, down:false, last:null,
             calm: !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)};
  const fit = ()=>{
    const r = cv.getBoundingClientRect(); if(!r.width) return;
    b.dpr = Math.min(3, window.devicePixelRatio||1);
    b.geo = bedGeo(r.width); b.str = bedStrings(b.geo, cfg);
    cv.style.height = b.geo.H+"px";
    cv.width = Math.round(b.geo.W*b.dpr); cv.height = Math.round(b.geo.H*b.dpr);
    drawBed(b, performance.now()/1000+99);
  };
  b.fit = fit;
  const pt = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown", e=>{
    b.down = true; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    const p = pt(e); b.last = p;
    const n = nearest(b,p); if(n) pluckString(b,n.k,n.i,8,n.dir,true);
  });
  cv.addEventListener("pointermove", e=>{
    const p = pt(e), prev = b.last || p;
    if(b.down || e.pointerType==="mouse") strum(b, prev, p, b.down);
    b.last = p;
  });
  const up = ()=>{ b.down = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  cv.addEventListener("pointerleave", ()=>{ if(!b.down) b.last = null; });
  if(typeof ResizeObserver!=="undefined"){ b.ro = new ResizeObserver(()=>fit()); b.ro.observe(cv); }
  fit();
  beds.add(b);
  return b;
}
function mountBeds(root){
  for(const b of [...beds]) if(!document.contains(b.cv)){ if(b.ro) b.ro.disconnect(); if(b.raf) cancelAnimationFrame(b.raf); beds.delete(b); }
  (root||document).querySelectorAll("canvas.bed").forEach(cv=>{ if(!cv._bed) cv._bed = makeBed(cv); else cv._bed.fit(); });
}

/* Kleines, statisches Saitenbett für Listen (SVG, gleiche Geometrie). */
function miniBed(rid, size){
  const cfg = bedCfgFromRacket(rid), W=100, g = bedGeo(W), s = bedStrings(g, cfg), id = "mb"+Math.random().toString(36).slice(2,8);
  let o = '<svg class="minibed" viewBox="0 0 '+W+' '+(W*BED_ASPECT)+'" width="'+(size||34)+'" aria-hidden="true"><defs><clipPath id="'+id+'"><ellipse cx="'+g.cx+'" cy="'+g.cy+'" rx="'+g.rxi+'" ry="'+g.ryi+'"/></clipPath></defs><g clip-path="url(#'+id+')" stroke-width="1.6">';
  s.c.forEach(c=>{ o += '<line x1="'+c.a.toFixed(1)+'" y1="'+c.p.toFixed(1)+'" x2="'+c.b.toFixed(1)+'" y2="'+c.p.toFixed(1)+'" stroke="'+esc(cfg.cc)+'"/>'; });
  s.m.forEach(m=>{ o += '<line x1="'+m.p.toFixed(1)+'" y1="'+m.a.toFixed(1)+'" x2="'+m.p.toFixed(1)+'" y2="'+m.b.toFixed(1)+'" stroke="'+esc(cfg.cm)+'"/>'; });
  o += '</g><ellipse cx="'+g.cx+'" cy="'+g.cy+'" rx="'+g.rx+'" ry="'+g.ry+'" fill="none" stroke="currentColor" stroke-width="'+g.fw.toFixed(1)+'"/>';
  o += '<path d="M'+(g.cx-g.rx*0.34)+' '+(g.cy+g.ry*0.92)+' L'+(g.cx-5)+' '+(BED_ASPECT*W*0.885)+' M'+(g.cx+g.rx*0.34)+' '+(g.cy+g.ry*0.92)+' L'+(g.cx+5)+' '+(BED_ASPECT*W*0.885)+'" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>';
  o += '<rect x="'+(g.cx-5.4)+'" y="'+(BED_ASPECT*W*0.86)+'" width="10.8" height="'+(BED_ASPECT*W*0.14)+'" rx="3.4" fill="currentColor"/></svg>';
  return o;
}

function selectedJob(){
  let j = UI.sel && jobById(UI.sel);
  if(!j) j = jobsSorted()[0];
  UI.sel = j? j.id : null;
  return j;
}
function filtered(){
  const q = F.q.trim().toLowerCase();
  const list = jobsSorted().filter(j=>{
    if(F.player && j.playerId!==F.player) return false;
    if(F.string && j.mainId!==F.string && j.crossId!==F.string) return false;
    if(F.period){
      if(F.period==="30"){ if(daysBetween(j.date,todayISO())>30) return false; }
      else if(F.period==="365"){ if(daysBetween(j.date,todayISO())>365) return false; }
      else if(!j.date.startsWith(F.period)) return false;
    }
    const ts = tensions(j), t = Math.min.apply(null,ts), t2 = Math.max.apply(null,ts);
    if(F.kgMin!=="" && t2 < +F.kgMin) return false;
    if(F.kgMax!=="" && t > +F.kgMax) return false;
    if(q){
      const hay = [pName(j.playerId), rName(j.racketId), sFull(j.mainId), j.crossId?sFull(j.crossId):"", j.note, j.reason, fmtKg(j.tMain)+"kg"].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  if(F.sort==="kg") list.sort((a,b)=> b.tMain-a.tMain);
  else if(F.sort==="player") list.sort((a,b)=> pName(a.playerId).localeCompare(pName(b.playerId)) || b.date.localeCompare(a.date));
  return list;
}
const filterCount = () => ["player","string","period","kgMin","kgMax"].filter(k=>F[k]!=="").length + (F.sort!=="date"?1:0);

function tape(s, rem, pct){

  return '<span class="tape'+cls+'" role="img" aria-label="'+Math.round(rem)+' von '+s.roll+' Metern übrig" style="--p:'+pct+'%;--n:'+Math.max(1,Math.round(s.roll/10))+'"><span class="rail"><i></i></span><b class="num">'+Math.round(rem)+' m</b><em>von '+s.roll+' m</em></span>';
}
function stringRow(s){
  const used = jobsWithString(s.id), kgs = stringTensions(s), rem = stringRemaining(s), pct = s.roll? Math.max(0,Math.min(100,Math.round(rem/s.roll*100))) : null;

    (s.roll? tape(s,rem,pct) : (s.own!==false? '<span class="row-strings muted">Einzelset, keine Rollenlänge hinterlegt</span>' : ''))+'</span>'+

/* ── Statistik ── */
function viewStats(){
  const all = jobsSorted();
  const js = statScope==="ich"? all.filter(j=>isMe(j.playerId)) : statScope==="andere"? all.filter(j=>!isMe(j.playerId)) : all;
  const seg = '<div class="seg" role="group" aria-label="Auswahl">'+[["alle","Alle"],["ich","Nur ich"],["andere","Nur andere"]].map(a=>'<button type="button" data-act="scope" data-scope="'+a[0]+'" aria-pressed="'+(statScope===a[0])+'">'+a[1]+'</button>').join("")+'</div>';
  const head = vhead("Statistik", seg);
  if(!js.length) return head+'<div class="none"><h3>Noch keine Daten</h3><p>'+(statScope==="alle"? "Sobald du Bespannungen einträgst, siehst du hier Rhythmus, Härten und Verbrauch." : "In dieser Auswahl gibt es noch keine Bespannung.")+'</p></div>';
  const kgs = js.flatMap(tensions).filter(n=>!isNaN(n));
  const revenue = js.reduce((a,j)=>a+(+j.price||0),0), open = js.filter(j=>!j.paid).reduce((a,j)=>a+(+j.price||0),0);
  const sc={}, pc={}, rc={};
  js.forEach(j=>{ [j.mainId,j.crossId].filter(Boolean).forEach(id=>sc[id]=(sc[id]||0)+1); pc[j.playerId]=(pc[j.playerId]||0)+1; rc[j.racketId]=(rc[j.racketId]||0)+1; });
  const top = o => Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const topS = top(sc), topP = top(pc), topR = top(rc);
  const oldest = js[js.length-1].date;
  let story = '<b class="num">'+js.length+'</b> '+plural(js.length,"Bespannung","Bespannungen")+' seit '+fmtDate(oldest)+'. Im Schnitt <b class="num">'+fmtKg(avg1(kgs))+' kg</b> ('+lbs(avg(kgs))+' lbs)';
  if(topS.length) story += ', am häufigsten mit <b>'+esc(sName(topS[0][0]))+'</b>';
  story += '.';
  if(revenue>0) story += ' Umsatz <b class="num">'+eur(revenue)+'</b>'+(open>0? ', davon <b class="num warn">'+eur(open)+'</b> noch offen' : '')+'.';
  const now = new Date(), months = [];
  for(let i=11;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({key:d.getFullYear()+"-"+pad2(d.getMonth()+1),lb:MONTHS_S[d.getMonth()],yr:d.getFullYear(),now:i===0}); }
  months.forEach(m=>m.n = js.filter(j=>j.date.startsWith(m.key)).length);
  const maxM = Math.max(1,...months.map(m=>m.n));
  const bars = months.map(m=>'<div class="bar'+(m.now?' now':'')+'" style="--h:'+(m.n? Math.max(7,Math.round(m.n/maxM*100)) : 0)+'%" title="'+MONTHS[+m.key.slice(5,7)-1]+' '+m.yr+': '+m.n+'"><b class="num">'+(m.n||"")+'</b><div class="col"><i></i></div><span>'+m.lb+'</span></div>').join("");
  const lo = Math.floor(Math.min.apply(null,kgs)), hi = Math.floor(Math.max.apply(null,kgs)), bk = [];
  for(let k=lo;k<=hi;k++) bk.push({k, n:kgs.filter(x=>Math.floor(x)===k).length});
  const maxB = Math.max(1,...bk.map(b=>b.n)), mean = avg(kgs), mpos = ((mean-lo)/(hi+1-lo))*100;
  const hist = '<div class="hist" style="--cols:'+bk.length+'">'+bk.map(b=>'<div class="hb" style="--h:'+(b.n? Math.max(8,Math.round(b.n/maxB*100)) : 0)+'%"><b class="num">'+(b.n||"")+'</b><div class="col"><i></i></div><span class="num">'+b.k+'</span></div>').join("")+'<div class="mean" style="--x:'+mpos.toFixed(1)+'%"><span class="num">Ø '+fmtKg(avg1(kgs))+'</span></div></div>';
  const rank = (rows, nameFn, colorFn) => '<ol class="rank">'+rows.map(r=>'<li><span class="rk-name">'+(colorFn? '<i class="sw" style="--c:'+esc(colorFn(r[0]))+'"></i>' : '')+esc(nameFn(r[0]))+'</span><b class="num">'+r[1]+'×</b><span class="rk-bar"><i style="--w:'+Math.round(r[1]/rows[0][1]*100)+'%;--c:'+esc(colorFn? colorFn(r[0]) : "var(--accent)")+'"></i></span></li>').join("")+'</ol>';
  const second = statScope==="ich"? ['Deine Schläger', rank(topR, rName)] : ['Wen du bespannst', rank(topP, pName)];
  return head+'<p class="story">'+story+'</p>'+
    '<div class="charts"><section class="chart wide" aria-labelledby="c1"><h2 id="c1" class="h3">Letzte 12 Monate</h2><div class="bars" role="img" aria-label="Bespannungen pro Monat">'+bars+'</div></section>'+
    '<section class="chart" aria-labelledby="c2"><h2 id="c2" class="h3">Härten</h2>'+hist+'<p class="note">Jede Zahl ist ein Kilo-Bereich, ein Balken zählt die Bespannungen darin.</p></section>'+
    '<section class="chart" aria-labelledby="c3"><h2 id="c3" class="h3">Meistgenutzte Saiten</h2>'+rank(topS, sName, id=>(strg(id)||{}).color||"#888")+'</section>'+
    '<section class="chart" aria-labelledby="c4"><h2 id="c4" class="h3">'+second[0]+'</h2>'+second[1]+'</section></div>';
}

/* ══════════ Blätter ══════════
   Auf dem Handy von unten (mit Wischen zum Schließen), am Rechner von rechts.
   Bestätigungen sind kleine Dialoge in der Mitte. */
const layers = [];
let needsRender = false;
const raf = f => (typeof requestAnimationFrame!=="undefined"? requestAnimationFrame(f) : setTimeout(f,0));
function openSheet(o){
  const root = $("#layers");
  const el = document.createElement("div");
  el.className = "layer";
  el.innerHTML = '<div class="scrim" data-act="close"></div><section class="sheet'+(o.kind==="dialog"?" dialog":"")+(o.wide?" wide":"")+(o.cls?" "+o.cls:"")+'" role="dialog" aria-modal="true" aria-label="'+esc(o.title||"Dialog")+'" tabindex="-1">'+
    '<div class="grab" aria-hidden="true"></div>'+
    '<header class="sheet-head"><h2 class="disp">'+esc(o.title||"")+'</h2>'+(o.headExtra||"")+'<button class="btn icon ghost" data-act="close" aria-label="Schließen">'+ic("x")+'</button></header>'+
    '<div class="sheet-body">'+(o.body||"")+'</div>'+(o.foot? '<footer class="sheet-foot">'+o.foot+'</footer>' : '')+'</section>';
  root.appendChild(el);
  const sheet = el.querySelector(".sheet");
  const layer = {el, sheet, prevFocus:document.activeElement, onClose:o.onClose};
  layers.push(layer);
  document.documentElement.classList.add("noscroll");
  void el.offsetHeight;            // Startzustand festschreiben, dann sofort einschalten (kein Warten auf einen Frame)
  el.classList.add("on");
  if(o.onMount) o.onMount(sheet, layer);
  mountBeds(sheet); paintSound();
  if(o.focus!==false){
    const f = sheet.querySelector("[data-autofocus]") || sheet.querySelector("input:not([type=hidden]):not([type=range]):not([type=radio]),select,textarea");
    try{ (f||sheet).focus({preventScroll:true}); }catch(e){}
  }
  enableSwipe(layer);
  return sheet;
}
function closeSheet(){
  const l = layers.pop(); if(!l) return;
  l.el.classList.remove("on"); l.el.classList.add("out");
  setTimeout(()=>{ try{ l.el.remove(); }catch(e){} }, 230);
  if(!layers.length){
    document.documentElement.classList.remove("noscroll");
    if(needsRender){ needsRender = false; render(); }
  }
  try{ if(l.prevFocus && l.prevFocus.focus) l.prevFocus.focus({preventScroll:true}); }catch(e){}
  if(l.onClose) l.onClose();
}
function closeAllSheets(){ while(layers.length) closeSheet(); }
function enableSwipe(layer){
  const sh = layer.sheet, grab = sh.querySelector(".grab");
  if(!grab) return;
  let y0 = null, dy = 0;
  grab.addEventListener("pointerdown", e=>{ if(isWide()) return; y0 = e.clientY; dy = 0; sh.style.transition = "none"; try{ grab.setPointerCapture(e.pointerId); }catch(_){} });
  grab.addEventListener("pointermove", e=>{ if(y0==null) return; dy = Math.max(0, e.clientY-y0); sh.style.transform = "translateY("+dy+"px)"; });
  const end = ()=>{ if(y0==null) return; sh.style.transition = ""; const close = dy>110; y0 = null; if(close) closeSheet(); else sh.style.transform = ""; };
  grab.addEventListener("pointerup", end); grab.addEventListener("pointercancel", end);
}
function toast(msg){
  const root = $("#toasts"); if(!root) return;
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; root.appendChild(t);
  while(root.children.length>2) root.firstChild.remove();
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>{ try{ t.remove(); }catch(e){} }, 260); }, 2800);
}
function confirmDialog(title, text, onYes, yesLabel, plain){
  const sh = openSheet({title, kind:"dialog", focus:false, body:'<p class="dlg-text">'+esc(text)+'</p>',
    foot:'<button class="btn" data-act="close">Abbrechen</button><button class="btn '+(plain?'primary':'danger')+'" id="cfYes">'+esc(yesLabel||"Löschen")+'</button>'});
  const yes = sh.querySelector("#cfYes"); try{ yes.focus({preventScroll:true}); }catch(e){}
  yes.onclick = ()=>{ closeSheet(); onYes(); };
}

    const rk = q("#jRacket").value; if(rk && rk!=="__new") j.racketId = rk;
    const sm = sheet.querySelector('input[name="sm"]:checked'); if(sm) j.mainId = sm.value;
    const sc = sheet.querySelector('input[name="sc"]:checked'); if(sc) j.crossId = sc.value;
    const num = s => { const v = parseFloat(String(q(s).value).replace(",",".")); return isNaN(v)? 0 : v; };
    j.mainM = num("#jMainM"); if(hybrid && q("#jCrossM")) j.crossM = num("#jCrossM");
    j.reason = q("#jReason").value; j.price = q("#jPrice").value.trim().replace(",","."); j.paid = q("#jPaid").checked; j.note = q("#jNote").value;
  }
  function paintT(){
    ["main","cross"].forEach(key=>{
      const box = sheet.querySelector('.tc[data-key="'+key+'"]'); if(!box) return;
      const v = key==="main"? j.tMain : j.tCross;
      box.querySelector(".lcdslot").innerHTML = lcd(lcdStr(v), {h:60, label:(key==="main"?"Längs ":"Quer ")+fmtKg(v)+" Kilogramm"});
      const r = box.querySelector(".ruler"); if(r && Number(r.value)!==Number(v)) r.value = v;
      const n = box.querySelector(".tc-in"); if(n && document.activeElement!==n) n.value = fmtKg(v);
      box.querySelector(".tc-lbs").textContent = lbs(v)+" lbs";
    });
    const lk = sheet.querySelector("[data-link]"); if(lk){ lk.setAttribute("aria-pressed", String(linked)); lk.innerHTML = ic(linked?"link-simple":"link-simple-break")+"<span>Quer wie Längs</span>"; }
  }
  function setT(key, v){
    v = Math.max(10, Math.min(40, Math.round(v*100)/100));
    if(key==="main"){ j.tMain = v; if(linked) j.tCross = v; }
    else { j.tCross = v; if(Number(v)!==Number(j.tMain)) linked = false; }
    paintT();
  }
  function rerender(){ readFields(); q(".sheet-body").innerHTML = body(); paintT(); }
  function applyModeMeters(){ if(metersTouched) return; j.mainM = hybrid? S.settings.defaultMainM : S.settings.defaultMeters; j.crossM = hybrid? S.settings.defaultCrossM : 0; }

  sheet = openSheet({
    title: isNew? "Neue Bespannung" : "Bespannung bearbeiten", wide:true, body: body(),
    foot:(!isNew? '<button class="btn danger sm lead" id="jDelete">Löschen</button>' : '<span class="lead"></span>')+'<button class="btn" data-act="close">Abbrechen</button><button class="btn primary" id="jSave">'+(isNew? "Eintragen" : "Speichern")+'</button>',
    focus:false,
    onMount(sh){
      sheet = sh; paintT();
      sh.addEventListener("input", e=>{
        const t = e.target, box = t.closest && t.closest(".tc"); if(!box) { if(t.id==="jMainM"||t.id==="jCrossM") metersTouched = true; return; }
        if(t.classList.contains("ruler")) setT(box.dataset.key, parseFloat(t.value));
        else if(t.classList.contains("tc-in")){ const v = parseFloat(String(t.value).replace(",",".")); if(!isNaN(v) && v>=10 && v<=40) setT(box.dataset.key, v); }
      });
      sh.addEventListener("change", e=>{
        const t = e.target;
        if(t.id==="jPlayer"){
          if(t.value==="__new"){ t.value = j.playerId; playerForm(null, p=>{ j.playerId = p.id; const rs = ownerRackets(); j.racketId = rs[0]? rs[0].id : ""; if(j.racketId) applyLast(); rerender(); }); return; }
          readFields(); const rs = ownerRackets(); j.racketId = rs[0]? rs[0].id : ""; if(isNew && j.racketId) applyLast(); rerender();
        } else if(t.id==="jRacket"){
          if(t.value==="__new"){ t.value = j.racketId; racketForm(null, r=>{ j.playerId = r.ownerId; j.racketId = r.id; rerender(); }, j.playerId); return; }
          readFields(); if(isNew) applyLast(); rerender();
        }
      });
      sh.addEventListener("click", e=>{
        const rd = e.target;
        if(rd.matches && rd.matches('input[type="radio"][name="sm"],input[type="radio"][name="sc"]')){ readFields(); spOpen[rd.name] = false; rerender(); return; }
        const b = e.target.closest("button"); if(!b) return;
        if(b.dataset.step){ const box = b.closest(".tc"), key = box.dataset.key; setT(key, (key==="main"? j.tMain : j.tCross) + parseFloat(b.dataset.step)); }
        else if(b.dataset.hy!==undefined){ readFields(); hybrid = b.dataset.hy==="1"; if(hybrid && !j.crossId) j.crossId = (S.strings.find(s=>s.own!==false && s.id!==j.mainId)||{}).id || j.mainId; applyModeMeters(); rerender(); }
        else if(b.dataset.sptoggle){ readFields(); spOpen[b.dataset.sptoggle] = true; rerender(); }
        else if(b.hasAttribute("data-link")){ linked = !linked; if(linked) j.tCross = j.tMain; paintT(); }
        else if(b.dataset.newstring){ const nm = b.dataset.newstring; readFields(); stringForm(null, s=>{ if(nm==="sm") j.mainId = s.id; else j.crossId = s.id; rerender(); }); }
      });
      sh.querySelector("#jSave").onclick = ()=>{
        readFields();
        if(!j.racketId){ toast("Bitte einen Schläger wählen oder anlegen"); return; }
        if(!j.mainId){ toast("Bitte eine Saite wählen"); return; }
        if(hybrid && !j.crossId){ toast("Bitte die Quersaite wählen"); return; }
        if(!(j.tMain>=10 && j.tMain<=40) || !(j.tCross>=10 && j.tCross<=40)){ toast("Härte prüfen (10 bis 40 kg)"); return; }
        const rec = Object.assign({}, j, {price: j.price===""? 0 : (+j.price||0)});
        if(!hybrid){ rec.crossId = ""; rec.crossM = 0; }
        if(isNew){ rec.id = uid(); rec.createdAt = new Date().toISOString(); S.jobs.push(rec); }
        else { const i = S.jobs.findIndex(x=>x.id===j.id); S.jobs[i] = Object.assign({}, S.jobs[i], rec); }
        UI.sel = rec.id; save(); closeAllSheets(); route.tab = "archiv"; render();
        toast(isNew? "Eingetragen: "+pName(rec.playerId)+", "+fmtKg(rec.tMain)+(isSplit(rec)? "/"+fmtKg(rec.tCross) : "")+" kg" : "Gespeichert");
      };
      const del = sh.querySelector("#jDelete");
      if(del) del.onclick = ()=> confirmDialog("Bespannung löschen?", pName(j.playerId)+", "+fmtDate(j.date)+", "+fmtKg(j.tMain)+" kg wird aus dem Archiv entfernt.",
        ()=>{ S.jobs = S.jobs.filter(x=>x.id!==j.id); save(); closeAllSheets(); render(); toast("Eintrag gelöscht"); });
    }
  });
}

/* ══════════ GitHub-Abgleich ══════════
   Muster wie bei den anderen Apps: Contents-API, Token nur im Browser.
   Wichtigste Regel (nach dem Datenverlust im Trainingsbuch): NIE den lokalen Stand
   hochladen, bevor der Stand aus der Cloud eingearbeitet ist. Erst holen, zusammenführen,
   dann nur bei echtem Unterschied schreiben. Unlesbares wird nie als „leer“ behandelt. */
const GH_CFG="saitenbuch_gh", GH_TOK="saitenbuch_gh_token";
const ghStandard = {user:"mattiknp", repo:"routine-tracker", file:"saitenbuch.json", on:false};
function ghCfg(){ try{ return Object.assign({}, ghStandard, JSON.parse(localStorage.getItem(GH_CFG)||"{}")); }catch(e){ return Object.assign({}, ghStandard); } }
function ghSetCfg(c){ try{ localStorage.setItem(GH_CFG, JSON.stringify(c)); }catch(e){} }
function ghTok(){ try{ return (localStorage.getItem(GH_TOK)||"").trim(); }catch(e){ return ""; } }
function ghSetTok(t){ t = String(t||"").trim(); try{ if(t) localStorage.setItem(GH_TOK,t); else localStorage.removeItem(GH_TOK); }catch(e){} }
const ghBase = () => (typeof window!=="undefined" && window.__SAITENBUCH_TEST__ && window.__GH_BASE__) || "https://api.github.com";
function ghUrl(){ const c = ghCfg(); return ghBase()+"/repos/"+c.user+"/"+c.repo+"/contents/"+encodeURIComponent(c.file); }
function ghAktiv(){ const c = ghCfg(); return !!(c.on && ghTok() && c.user && c.repo && c.file); }
function ghTyp(){ const t = ghTok(); if(/^ghp_/.test(t)) return "classic"; if(/^github_pat_/.test(t)) return "fein"; return t? "andere" : "keiner"; }
/* Klassische Token wollen „token …“, feingranulare „Bearer …“; wir probieren das andere bei 401. */
let ghScheme = "token";
async function ghFetch(url, opt){
  opt = opt||{};
  const mit = sch => Object.assign({}, opt, {headers:Object.assign({Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}, opt.headers||{}, {Authorization:sch+" "+ghTok()})});
  let r = await fetch(url, mit(ghScheme));
  if(r.status===401){
    const anders = ghScheme==="token"? "Bearer" : "token";
    const r2 = await fetch(url, mit(anders));
    if(r2.status!==401){ ghScheme = anders; return r2; }
  }
  return r;
}
const b64enc = s => btoa(unescape(encodeURIComponent(s)));
const b64dec = s => decodeURIComponent(escape(atob(String(s).replace(/\s/g,""))));
function ghFehler(e){
  const c = ghCfg(), typ = ghTyp();
  if(e && e.unreadable) return "Die Datei im Repo ist nicht lesbar. Es wurde nichts überschrieben.";
  if(!e || !e.status) return "gesperrt";
  switch(e.status){
    case 401: return "Token wird abgelehnt: abgelaufen, unvollständig eingefügt oder widerrufen?";
    case 403: return typ==="classic"? "Zugriff verweigert: ein klassischer Token braucht den Bereich „repo“." : "Zugriff verweigert: dem Token fehlt „Contents: Read and write“ für dieses Repo.";
    case 404: return c.user+"/"+c.repo+" nicht gefunden. Schreibweise prüfen und ob der Token dieses Repo freigibt.";
    case 409: case 422: return "Der Stand hat sich zwischenzeitlich geändert. Bitte noch einmal abgleichen.";
    default: return "GitHub antwortet mit "+e.status;
  }
}

let syncState = "off", syncText = "Nicht verbunden", syncSha = null, syncTimer = null, syncBusy = false, syncAgain = false;
function setSync(state, text){ syncState = state; syncText = text||""; paintSync(); refreshData(); }
function syncView(){
  if(ghAktiv()){
    if(syncState==="busy") return {cls:"busy", icon:"arrows-clockwise", label:"Gleicht ab", title:"Gleicht mit GitHub ab"};
    if(syncState==="err") return {cls:"err", icon:"cloud-warning", label:"Abgleich gestört", title:syncText};
    if(S && S.meta.changes>0) return {cls:"busy", icon:"cloud-arrow-up", label:"Wird gesichert", title:"Änderungen werden gleich nach GitHub geschrieben"};
    return {cls:"ok", icon:"cloud-check", label:"Synchron", title:S && S.meta.syncedAt? "Zuletzt abgeglichen: "+fmtDate(localISO(new Date(S.meta.syncedAt))) : "Mit GitHub verbunden"};
  }
  if(S && (S.meta.changes>0 || (S.jobs.length && !S.meta.exportedAt))) return {cls:"warn", icon:"cloud-slash", label:"Nicht gesichert", title:"Nur in diesem Browser gespeichert. Daten und Abgleich öffnen."};
  return {cls:"off", icon:"cloud-slash", label:"Nur lokal", title:"Nicht mit GitHub verbunden"};
}
function paintSync(){
  const b = $("#syncBtn"); if(!b || !S) return;
  const v = syncView();
  b.className = "sync "+v.cls; b.title = v.title; b.setAttribute("aria-label", "Daten und Abgleich: "+v.label);
  b.innerHTML = ic(v.icon)+"<span>"+v.label+"</span>";
}
function queueSync(){
  paintSync();
  if(!ghAktiv()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(()=>syncNow(), 1500);
}
async function ghGet(){
  const r = await ghFetch(ghUrl()+"?v="+Date.now());
  if(r.status===404) return null;
  if(!r.ok){ const e = new Error("http"); e.status = r.status; throw e; }
  const j = await r.json();
  let text = null;
  if(j.content && j.encoding!=="none"){ try{ text = b64dec(j.content); }catch(e){ text = null; } }
  else {                                              // Datei über 1 MB: Rohinhalt separat holen
    const rr = await ghFetch(ghUrl()+"?v="+Date.now(), {headers:{Accept:"application/vnd.github.raw+json"}});
    if(!rr.ok){ const e = new Error("http"); e.status = rr.status; throw e; }
    text = await rr.text();
  }
  let state = null;
  try{ state = JSON.parse(text); }catch(e){ state = null; }
  if(!state || !Array.isArray(state.players) || !Array.isArray(state.jobs)){ const e = new Error("unlesbar"); e.unreadable = true; throw e; }
  return {sha:j.sha, state};
}
async function ghPut(state, sha){
  const body = {message:"Saitenbuch: "+state.jobs.length+" Bespannungen, "+todayISO(), content:b64enc(JSON.stringify(state,null,2))};
  if(sha) body.sha = sha;
  const r = await ghFetch(ghUrl(), {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if(!r.ok){ const e = new Error("http"); e.status = r.status; throw e; }
  return (await r.json()).content.sha;
}
function adopt(merged){
  merged.meta = S.meta; S = merged; ensureMeta(S); baseline(S);
  if(layers.length) needsRender = true; else render();
}
/* Ein Durchlauf: holen, zusammenführen, nur bei Unterschied hochladen. */
async function syncNow(o){
  o = o||{};
  if(!ghAktiv()) return false;
  if(syncBusy){ syncAgain = true; return false; }
  syncBusy = true; setSync("busy","Gleicht ab");
  try{
    for(let round=0; round<3; round++){
      stamp(S);                                       // noch ungestempelte lokale Änderungen erfassen
      const rem = await ghGet();
      let remoteKey = null;
      if(rem){
        syncSha = rem.sha;
        const merged = mergeStates(S, rem.state);
        remoteKey = contentKey(migrate(clone(rem.state)));
        if(contentKey(merged) !== contentKey(S)) adopt(merged);
      } else syncSha = null;
      const localKey = contentKey(S);
      if(rem && localKey===remoteKey){ break; }       // nichts zu schreiben
      try{
        syncSha = await ghPut(exportState(), syncSha);
        break;
      }catch(e){
        if((e.status===409 || e.status===422) && round<2) continue;   // zwischenzeitlich geändert: neu holen und erneut mischen
        throw e;
      }
    }
    ensureMeta(S); S.meta.syncedAt = new Date().toISOString(); S.meta.changes = 0; persist();
    setSync("ok","Synchron");
    return true;
  }catch(e){
    const t = ghFehler(e);
    setSync("err", t==="gesperrt"? "GitHub ist von hier nicht erreichbar" : t);
    if(o.laut) toast(t==="gesperrt"? "Diese Ansicht darf GitHub nicht ansprechen. Öffne die Website oder die lokale Datei." : t);
    return false;
  }finally{
    syncBusy = false;
    if(syncAgain){ syncAgain = false; queueSync(); }
  }
}

/* ══════════ Sicherung, Import, Wiederherstellen ══════════ */
async function exportBackup(){
  const data = JSON.stringify(exportState(), null, 2), name = "saitenbuch-"+todayISO()+".json";
  const ok = () => { ensureMeta(S); S.meta.exportedAt = new Date().toISOString(); persist(); paintSync(); refreshData(); toast("Gesichert. Die Datei ist dein Archiv auf Papier."); };
  if(window.claude && window.claude.downloads){
    try{ await window.claude.downloads.save({filename:name, data}); ok(); return; }
    catch(err){
      if(err && err.code==="declined") return;
      if(err && err.code==="rate_limited"){ toast("Kurz warten und noch einmal versuchen"); return; }
    }
  }
  try{
    const url = URL.createObjectURL(new Blob([data], {type:"application/json"}));
    const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500); ok();
  }catch(e){ toast("Sichern ist in dieser Ansicht nicht möglich"); }
}
function importBackup(file){
  const fr = new FileReader();
  fr.onload = ()=>{
    try{
      const p = JSON.parse(fr.result);
      if(!p || !Array.isArray(p.players) || !Array.isArray(p.jobs)) throw new Error("bad");
      confirmDialog("Sicherung einlesen?", "Ersetzt das aktuelle Archiv ("+S.jobs.length+" "+plural(S.jobs.length,"Eintrag","Einträge")+") durch "+p.jobs.length+" "+plural(p.jobs.length,"Eintrag","Einträge")+" aus der Datei.",
        ()=>{ replaceState(p); loadProblem = null; persist(); closeAllSheets(); render({top:true}); queueSync(); toast("Eingelesen: "+p.jobs.length+" "+plural(p.jobs.length,"Bespannung","Bespannungen")); }, "Einlesen", true);
    }catch(e){ toast("Die Datei ließ sich nicht lesen"); }
  };
  fr.readAsText(file);
}

async function ghConnect(sh){
  const q = s => sh.querySelector(s);
  const t = q("#ghTok").value.trim(); if(t) ghSetTok(t);
  if(!ghTok()){ toast("Ohne Token geht es nicht"); return; }
  ghSetCfg({user:q("#ghUser").value.trim(), repo:q("#ghRepo").value.trim(), file:q("#ghFile").value.trim()||"saitenbuch.json", on:true});
  syncSha = null;
  const ok = await syncNow({laut:true});
  if(ok) toast("Verbunden. Ab jetzt wird automatisch abgeglichen.");
  refreshData();
}

/* ══════════ Bedienung ══════════ */
const ACT = {
  tab(el){ route.tab = el.dataset.tab; closeAllSheets(); render({top:true}); },
  close(){ closeSheet(); },
  newjob(){ closeAllSheets(); jobForm(null); },
  newjobfor(el){ const p = el.dataset.id; closeAllSheets(); jobForm(null,{playerId:p}); },
  newjobrk(el){ const r = racket(el.dataset.id); closeAllSheets(); if(r) jobForm(null,{playerId:r.ownerId, racketId:r.id}); },
  repeat(el){
    const j = jobById(el.dataset.id); if(!j) return; closeAllSheets();
    jobForm(null,{playerId:j.playerId,racketId:j.racketId,mainId:j.mainId,crossId:j.crossId,tMain:j.tMain,tCross:j.tCross,mainM:j.mainM,crossM:j.crossM,reason:"Verschleiß / Spannungsverlust",price:j.price,paid:true});
  },
  job(el){
    const id = el.dataset.id, j = jobById(id); if(!j) return;
    if(isWide() && !layers.length && el.closest("#listwrap")) selectJobInPlace(id); else jobSheet(j);
  },
  editjob(el){ const j = jobById(el.dataset.id); if(j){ closeAllSheets(); jobForm(j); } },
  paid(el){ const j = jobById(el.dataset.id); if(!j) return; j.paid = true; save(); closeAllSheets(); render(); toast("Als bezahlt markiert"); },
  player(el){ const p = player(el.dataset.id); if(p) playerSheet(p); },
  racket(el){ const r = racket(el.dataset.id); if(r) racketSheet(r); },
  string(el){ const s = strg(el.dataset.id); if(s) stringSheet(s); },
  addPlayer(){ playerForm(null); }, addRacket(){ racketForm(null); }, addString(){ stringForm(null); },
  editplayer(el){ const p = player(el.dataset.id); if(p){ closeAllSheets(); playerForm(p); } },
  editracket(el){ const r = racket(el.dataset.id); if(r){ closeAllSheets(); racketForm(r); } },
  editstring(el){ const s = strg(el.dataset.id); if(s){ closeAllSheets(); stringForm(s); } },
  newroll(el){ const s = strg(el.dataset.id); if(s){ s.rollOpened = todayISO(); save(); closeAllSheets(); render(); toast("Neue Rolle vermerkt, der Zähler steht wieder bei "+s.roll+" m"); } },
  filters(){ UI.filters = !UI.filters; render(); },
  fclear(){ F = {q:"",player:"",string:"",period:"",kgMin:"",kgMax:"",sort:"date"}; render(); },
  scope(el){ statScope = el.dataset.scope; render(); },
  ton(){ setSound(!sndOn); },
  daten(){ dataSheet(); },
  export(){ exportBackup(); },
  import(){ const f = $("#fileImport"); if(f) f.click(); },
  restore(){ restoreBackup(); },
  demo(){ confirmDialog("Beispieldaten laden?", "Legt drei erfundene Spieler mit Schlägern und zwölf Bespannungen an, nur zum Ausprobieren. Sie sind als Beispiel markiert und lassen sich unter „Daten und Abgleich“ wieder entfernen.", ()=>{ closeAllSheets(); loadDemo(); }, "Laden", true); },
  demoweg(){ entferneDemo(); },
  wipe(){ wipeAll(); },
  theme(el){ setTheme(el.dataset.theme); },
  ghon(el){ ghConnect(el.closest(".sheet")); },
  ghsync(){ syncNow({laut:true}); },
  ghoff(){ confirmDialog("GitHub trennen?", "Der Token wird aus diesem Browser entfernt. Die Datei im Repo bleibt liegen.", ()=>{ ghSetTok(""); ghSetCfg(Object.assign(ghCfg(),{on:false})); syncSha = null; setSync("off","Nicht verbunden"); refreshData(); toast("GitHub getrennt"); }, "Trennen"); },
  noticeoff(){ bannerZu = true; renderNotice(); }
};
document.addEventListener("click", e=>{
  const el = e.target.closest && e.target.closest("[data-act]"); if(!el) return;
  const f = ACT[el.dataset.act]; if(f) f(el, e);
});
document.addEventListener("input", e=>{
  const id = e.target.id;
  if(id==="fq"){ F.q = e.target.value; updateList(); }
  else if(id==="fkgmin"){ F.kgMin = e.target.value; updateList(); }
  else if(id==="fkgmax"){ F.kgMax = e.target.value; updateList(); }
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if(id==="fplayer"){ F.player = e.target.value; updateList(); }
  else if(id==="fstring"){ F.string = e.target.value; updateList(); }
  else if(id==="fperiod"){ F.period = e.target.value; updateList(); }
  else if(id==="fsort"){ F.sort = e.target.value; updateList(); }
  else if(id==="fileImport" && e.target.files[0]){ importBackup(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && layers.length){ closeSheet(); return; }
  if(e.key==="Tab" && layers.length){                       // Fokus bleibt im offenen Blatt
    const sh = layers[layers.length-1].sheet;
    const f = [...sh.querySelectorAll('button:not([disabled]),[href],input:not([type=hidden]):not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && (document.activeElement===first || document.activeElement===sh)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});
/* Eine App bleibt über Nacht im Speicher: Datum beim Zurückkehren neu bestimmen, dann abgleichen. */
let lastDay = todayISO();
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState!=="visible") return;
  if(todayISO()!==lastDay){ lastDay = todayISO(); if(!layers.length) render(); else needsRender = true; }
  if(ghAktiv() && !layers.length) syncNow();
});
if(wideMQ && wideMQ.addEventListener) wideMQ.addEventListener("change", ()=>{ if(!layers.length) render(); else needsRender = true; });

S = load();
applyTheme();
render({top:true});
if(ghAktiv()){ setSync("busy","Gleicht ab"); syncNow(); } else paintSync();

    viewArchive, viewPlayers, viewRackets, viewStrings, viewStats, viewEmpty, jobConsole, lcd, lcdStr, fmtKg, ago, todayISO, localISO, daysBetween,
    openSheet, closeAllSheets, layers, jobForm, playerForm, racketForm, stringForm, jobSheet, playerSheet, racketSheet, stringSheet, dataSheet, dataBody,
    setStatScope(v){ statScope = v; }, setRoute(t){ route.tab = t; }, getSync(){ return {syncState, syncText, syncSha}; }, syncView,
    getStorage(){ return {storageOK, loadProblem}; }, mergeAndAdopt(m){ adopt(m); }
  };
}
